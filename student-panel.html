  "chest-trauma": {"sections": [{"h": "۱) آناتومی و فیزیولوژی کاربردی قفسه سینه", "b": ["##دیواره‌ی قفسه سینه", ["قفسه سینه از ۱۲ مهره‌ی سینه‌ای و ۱۲ جفت دنده (پشت)، استخوان جناغ (جلو)، استخوان ترقوه (بالا) و دیافراگم (پایین) ساخته شده است؛ استخوان کتف هم از پشت محافظت می‌کند.", "دنده‌های ۱ تا ۵ مستقیم به جناغ وصل‌اند؛ دنده‌های ۶ تا ۱۰ با غضروف مشترک (قوس دنده‌ای) وصل می‌شوند؛ دنده‌های ۱۱ و ۱۲ «شناور» هستند و به جناغ متصل نیستند.", "دنده‌های فوقانی (۱ تا ۴) ضخیم و پهن‌اند و ترقوه و کتف از آن‌ها محافظت می‌کنند؛ دنده‌های تحتانی از طحال، کبد و کلیه‌ها محافظت می‌کنند.", "زیر لبه‌ی تحتانی هر دنده یک شریان، یک ورید و یک عصب (ناودان دنده‌ای) عبور می‌کند؛ پس برای جلوگیری از آسیب به آن‌ها، سوزن باید از روی لبه‌ی فوقانی دنده‌ی پایینی عبور کند.", "جناغ سه بخش دارد: مانوبریوم، تنه و زائده‌ی گزیفوئید. محل اتصال مانوبریوم به تنه (زاویه‌ی استرنال یا Angle of Louis) هم‌سطح دنده‌ی دوم است و نشانه‌ی قابل‌اعتمادی برای پیدا کردن فضای بین‌دنده‌ای دوم است."], "##عضلات", ["عضلات محافظ: بین‌دنده‌ای (اینترکوستال)، پکتورال بزرگ و کوچک، سراتوس قدامی و خلفی، لاتیسموس دورسی و عضلات پشت. وجود همین محافظ‌ها یعنی آسیب به اندام‌های داخل قفسه سینه نیاز به نیروی قابل‌توجهی دارد.", "عضلات تنفسی: دیافراگم (اصلی‌ترین)، عضلات بین‌دنده‌ای و عضلات گردن (کمکی)."], "##اندام‌های داخل قفسه سینه", ["قلب: سه لایه دارد؛ پریکارد (خارجی و محافظ)، میوکارد (میانی و عضلانی)، اندوکارد (داخلی). بین پریکارد و میوکارد مقدار اندکی مایع (حدود ۱۵ تا ۵۰ میلی‌لیتر) وجود دارد. قلب چهار حفره دارد (دو دهلیز و دو بطن).", "دیافراگم: عضله‌ی گنبدی‌شکل؛ از جلو به قوس دنده‌ها و از عقب به مهره‌های کمری وصل است. با دم پایین می‌رود و با کمک عضلات قفسه سینه هوا را به ریه‌ها می‌کشد.", "ریه‌ها: ریه‌ی راست ۳ لوب و ریه‌ی چپ ۲ لوب دارد. ساختار داخلی: برونش‌ها، برونشیول‌ها و آلوئول‌ها (محل تبادل گاز).", "پرده‌ی پلور: لایه‌ی احشایی (چسبیده به ریه) و لایه‌ی جداری (چسبیده به دیواره‌ی قفسه سینه). فضای بین آن‌ها (فضای پلور) فشار منفی و کمی مایع دارد و باعث می‌شود ریه همراه دیواره‌ی قفسه سینه باز و بسته شود.", "مدیاستن: قلب، عروق بزرگ، تراشه و مری را در بر می‌گیرد."], "##اصل مهم تهویه", "در دم، دیافراگم پایین می‌رود و دنده‌ها بالا و بیرون می‌روند؛ فشار داخل قفسه سینه منفی می‌شود و هوا وارد می‌شود. هر عاملی که این فشار منفی را به هم بزند (هوا، خون یا قطعه‌ی شناور)، تهویه را مختل می‌کند."]}, {"h": "۲) انواع آسیب‌ها و ارزیابی مکانیسم", "b": ["آسیب‌های قفسه سینه بر اثر تروما به‌صورت مستقیم یا غیرمستقیم، بلانت (تصادف، سقوط، برخورد با فرمان) یا نافذ (چاقو، گلوله، ترکش) ایجاد می‌شوند و پنج گروه‌اند:", ["۱) آسیب‌های استخوانی: شکستگی دنده، قفسه سینه‌ی شناور، شکستگی جناغ", "۲) آسیب‌های فضای پلور: پنوموتوراکس (ساده، باز، فشارنده) و هموتوراکس", "۳) آسیب‌های بافت پارانشیم ریه: کانتیوژن (کوفتگی) ریه", "۴) آسیب‌های قلب و عروق: کوفتگی میوکارد، تامپوناد، پارگی آئورت، خفگی تروماتیک", "۵) پارگی دیافراگم"], "##نکات کینماتیک", ["خم‌شدگی فرمان خودرو یعنی برخورد شدید قفسه سینه با آن؛ این نکته را به مرکز درمانی گزارش کنید.", "کاهش یا افزایش ناگهانی شتاب (تصادف پرسرعت از جلو، سقوط از ارتفاع) یعنی خطر پارگی آئورت، حتی اگر اثر خارجی چندانی دیده نشود.", "در ترومای نافذ، هر زخم پایین‌تر از خط نوک‌پستان در جلو یا نوک اسکاپولا در عقب می‌تواند همزمان دیافراگم و اندام‌های شکمی را درگیر کند (توراکو‌ابدومینال).", "وجود شیء خون‌آلود (مثلاً اسلحه) را هم گزارش کنید."]]}, {"h": "۳) آسیب‌های استخوانی قفسه سینه", "b": ["##الف) شکستگی دنده‌ها (Rib fractures)", ["شکستگی دنده‌های ۱ و ۲ نشان‌دهنده‌ی ضربه‌ی بسیار شدید است و اغلب با شکستگی ترقوه و گاهی اسکاپولا همراه است. خطر آسیب عروق و اعصاب ساب‌کلاوین، قله‌ی ریه، درخت نای و برونش و پارگی آئورت وجود دارد.", "شایع‌ترین محل شکستگی، قسمت جانبی دنده‌های ۴ تا ۸ است (نازک‌تر و با پوشش عضلانی کمتر). در شکستگی خلفی، دنده‌های ۵ تا ۹ بیشتر آسیب می‌بینند.", "شکستگی دنده‌های تحتانی می‌تواند به طحال، کبد و کلیه آسیب بزند.", "یک دنده‌ی شکسته می‌تواند سطح ریه را پاره کند و پنوموتوراکس، پنوموتوراکس فشارنده یا هموتوراکس ایجاد کند.", "در کودکان دنده‌ها و جناغ انعطاف‌پذیرترند؛ پس ممکن است بدون شکستگی دنده، اندام‌های زیرین آسیب ببینند. در بزرگسالان شکستگی ساده‌ی دنده به‌ندرت خطرناک است."], "##علائم شکستگی دنده", ["درد موضعی که با دم (و سرفه) تشدید می‌شود", "حساسیت موضعی (تندرنس)", "مقاومت در برابر نفس عمیق و سرفه به دلیل درد", "دفورمیتی دنده‌ها", "کریپتاسیون روی محل شکستگی"], "##اقدامات اورژانس", ["ABC مصدوم را حفظ کنید.", "پوزیشن نشسته یا نیمه‌نشسته بدهید، به‌شرط آنکه مانعی مثل کاهش سطح هوشیاری یا آسیب ستون فقرات نباشد.", "تسکین درد هدف اصلی است: اطمینان‌بخشی، حداقل کردن حرکت با پدگذاری مناسب، جای‌گذاری صحیح بازوها با Sling و Swathe و تجویز مسکن در صورت امکان.", "در شکستگی دنده‌های ۱ و ۲ طبق جزوه، برای برداشتن فشار از روی عروق و اعصاب ساب‌کلاوین بانداژ ۸ انجام دهید.", "از بی‌حرکت کردن دنده‌های شکسته با چسب یا تسمه خودداری کنید؛ این کار زمینه‌ی آتلکتازی و پنومونی را فراهم می‌کند.", "مصدوم هوشیار را به نفس عمیق و سرفه تشویق کنید (پیشگیری از کلاپس آلوئول‌ها و پنومونی).", "هر ۳۰ دقیقه علائم حیاتی و عوارض احتمالی (پنوموتوراکس، هموتوراکس، آمفیزم زیرجلدی، آسیب عروقی) را کنترل کنید.", "مصدوم را به مرکز درمانی مناسب منتقل کنید."], "##ب) قفسه سینه‌ی شناور (Flail chest)", "وقتی دو یا چند دنده‌ی مجاور در بیش از یک نقطه بشکنند، یک قطعه‌ی شناور ایجاد می‌شود که فقط اتصال عضلانی دارد و از حرکت قفسه سینه تبعیت نمی‌کند. این قطعه در دم به داخل و در بازدم به خارج می‌رود (حرکت متناقض یا پارادوکس) و تهویه را ناکارآمد می‌کند. نیروی لازم برای این آسیب، حتماً باعث کوفتگی ریه هم می‌شود.", "##علائم", ["درد شدید قفسه سینه و دنده‌ها، دفورمیتی، تندرنس و کریپتاسیون", "حرکت متناقض (پارادوکسیکال) قفسه سینه حین تنفس؛ در ابتدا اسپاسم عضلات بین‌دنده‌ای قطعه را ثابت نگه می‌دارد و با خسته شدن عضلات، حرکت پارادوکس آشکار می‌شود.", "دیسترس شدید تنفسی با افزایش تعداد و کاهش عمق تنفس", "معمولاً با کوفتگی ریه، هموتوراکس، پنوموتوراکس، آمفیزم زیرجلدی و نارسایی حاد تنفسی همراه است."], "##اقدامات اورژانس", ["ABC: راه هوایی را باز و حفظ کنید؛ کولار گردنی بزنید؛ تنفس کمکی با ماسک اکسیژن و در صورت عدم بهبود با BMV؛ در صورت نیاز اینتوباسیون.", "Circulation: آماده‌ی شوک باشید؛ پیشگیری از هیپوترمی، راه وریدی بزرگ و سرم‌درمانی را مدنظر داشته باشید.", "از بی‌حرکت کردن قطعه‌ی شناور، خواباندن بیمار روی سمت درگیر، گذاشتن کیسه‌ی شن روی قطعه و استفاده از چسب خودداری کنید.", "مصدوم را از نظر هموتوراکس، پنوموتوراکس و آمفیزم مداوم پایش کنید.", "مسکن در صورت امکان تجویز شود و مصدوم سریعاً منتقل شود."], "##ج) شکستگی جناغ سینه", ["معمولاً در ترومای مستقیم (فرمان یا داشبورد) رخ می‌دهد و ارتباط زیادی با آسیب میوکارد و ریه دارد؛ چون جناغ استخوان سخت و محکمی است، شکستگی آن یعنی نیروی زیاد و شدت آسیب بالا.", "علائم: درد و تندرنس جناغ، کریپتاسیون، تاکی‌پنه، تاکی‌کاردی مداوم، و در صورت کوفتگی میوکارد تغییرات ECG (بالا رفتن ST، معکوس شدن T، فلوتر یا فیبریلاسیون دهلیزی، PVC).", "اقدامات: ABC، توجه به آسیب‌های قلب (کوفتگی میوکارد، آئورت) و ریه (پنوموتوراکس، هموتوراکس، کوفتگی ریه)، مانیتورینگ قلبی برای پایش ریتم، اقدام برای آریتمی‌ها، مسکن و انتقال سریع."]]}, {"h": "۴) آسیب‌های فضای پلور", "b": ["##الف) پنوموتوراکس ساده (بسته)", ["ورود هوا به فضای جنب از خود ریه؛ بر اثر ترومای بلانت یا گاهی خودبه‌خودی (ضعف ریه). هر چه هوای بیشتری جمع شود، ریه‌ی سمت گرفتار بیشتر روی هم می‌خوابد و دیسترس شدیدتر می‌شود. در بیش از ۲۰ درصد آسیب‌های شدید قفسه سینه رخ می‌دهد.", "علائم: نشانه‌های ترومای بلانت، درد تیز و پلورتیک هنگام دم، تنگی نفس و تاکی‌پنه، کاهش حجم جاری، کاهش صداهای تنفسی سمت گرفتار و صدای طبل‌گونه (هایپررزونانس) در دق.", "اقدام: ABC و کولار، اکسیژن، پوزیشن نیمه‌نشسته (اگر مانعی نباشد)، پایش از نظر تبدیل به پنوموتوراکس فشارنده و انتقال برای تعبیه‌ی چست‌تیوب."], "##ب) پنوموتوراکس باز (Open pneumothorax)", ["بر اثر زخم نفوذی دوطرفه (در هر دو جهت) در دیواره‌ی قفسه سینه؛ در دم هوا از زخم وارد فضای پلور می‌شود و در بازدم خارج می‌شود (صدای مکیدن و قلقل). فشار منفی داخل قفسه سینه کم و تهویه مختل می‌شود. گاهی زخم مثل دریچه‌ی یک‌طرفه عمل می‌کند و راه را برای پنوموتوراکس فشارنده باز می‌کند.", "مکانیسم: ترومای نافذ (چاقو، گلوله، ترکش، فرو رفتن جسم نوک‌تیز)، شکستگی دنده‌ها و گاهی ترومای بلانت.", "علائم: زخم نافذ به قفسه سینه با صدای مکش در دم و قلقل در بازدم، درد تیز ناگهانی، دیسترس واضح تنفسی، تاکی‌پنه، بی‌قراری، کاهش صداهای تنفسی سمت مبتلا."], "##اقدامات", ["ABC، کولار، اکسیژن، BMV و اینتوباسیون در صورت نیاز؛ پوزیشن نیمه‌نشسته؛ راه وریدی و پیشگیری از هیپوترمی.", "زخم را با پوشش غیرقابل‌نفوذ به هوا (پانسمان شفاف یا تکه‌ی نایلون) بپوشانید و به‌صورت سه‌طرفه بچسبانید تا دریچه‌ی یک‌طرفه (فلوتر) درست شود: در دم مانع ورود هوا شود و در بازدم هوا خارج شود.", "روش‌های دیگر: درپوش آشرمن (Asherman) و درپوش بولین (Bolin) که دریچه‌ی یک‌طرفه دارند. هیچ برتری آن‌ها بر پانسمان ساده ثابت نشده است.", "اگر با پانسمان سه‌طرفه علائم دیسترس بدتر شد، پانسمان را کنار بزنید تا فشار رها شود؛ اگر کافی نبود، دکمپرسیون سوزنی و در نهایت تهویه با فشار مثبت و اینتوباسیون.", "در پنوموتوراکس باز، از وارد کردن گاز یا هوا به داخل زخم پرهیز کنید (فشار منفی دم می‌تواند آن را به داخل بکشد).", "به‌ویژه در مصدومان تحت تهویه با فشار مثبت، خطر تبدیل به پنوموتوراکس فشارنده و آمفیزم زیرجلدی وجود دارد؛ مرتب پایش کنید.", "مصدوم را فوراً برای تعبیه‌ی چست‌تیوب منتقل کنید."], "##ج) پنوموتوراکس فشارنده (Tension pneumothorax)", "وضعیتی که هوا وارد فضای جنب می‌شود ولی خارج نمی‌گردد. فشار داخل توراکس بالا می‌رود و دو مشکل خطرناک ایجاد می‌شود:", ["اختلال تنفسی: ریه‌ی سمت گرفتار روی هم می‌خوابد، مدیاستن به سمت مقابل جابه‌جا می‌شود و ریه‌ی سالم هم تحت فشار می‌رود؛ نتیجه هایپوکسی و نارسایی تنفسی است.", "شوک: جابه‌جایی مدیاستن، وریدهای اجوف فوقانی و تحتانی را فشرده می‌کند، برگشت وریدی به دهلیز راست و برون‌ده قلبی کاهش می‌یابد و شوک انسدادی غیرجبرانی ایجاد می‌شود که می‌تواند به مرگ بینجامد."], "##علائم", ["بی‌قراری، سراسیمگی، درد قفسه سینه و تنگی نفس که با بالا رفتن فشار شدیدتر می‌شود؛ در موارد شدید سیانوز، آپنه و علائم شوک", "علائم ترومای نافذ یا بلانت، دریچه‌ی یک‌طرفه‌ی ورود هوا، حرکت متناقض", "کاهش یا فقدان صداهای تنفسی سمت درگیر و رزونانس بیش از حد (هایپررزونانس) در دق", "اتساع وریدهای ژوگولار، آمفیزم زیرجلدی، برآمدگی عضلات بین‌دنده‌ای", "شیفت مدیاستن و انحراف تراشه به سمت سالم (علامت دیررس)", "افت فشار خون، باریک شدن فشار نبض، تاکی‌کاردی و نبض ضعیف، پوست سرد، مرطوب و خاکستری، کاهش سطح هوشیاری، شوک و ایست قلبی"], "##نکات مهم تشخیص", ["تریاد تنشن پنوموتوراکس: تاکی‌کاردی (نه لزوماً هیپوتانسیون)، برجستگی وریدهای گردنی، و فقدان یا کاهش صداهای تنفسی در سمت درگیر. هیپوتانسیون معمولاً در مراحل انتهایی دیده می‌شود.", "با کوچک‌ترین شک باید پنوموتوراکس فشاری مطرح شود. تریاد ممکن است ناقص باشد: هیپوولمی ناشی از خونریزی (مثلاً هموتوراکس) مانع برجستگی وریدهای گردن می‌شود؛ در COPD و قفسه‌ی بشکه‌ای و در کودکان که با گوشی بزرگسال سمع می‌شوند، ممکن است صدای ریه‌ی مقابل در سمت درگیر شنیده شود.", "در شک به پنوموتوراکس فشاری، درمان (دکمپرسیون سوزنی) را بدون تأخیر و بدون نیاز به اثبات انجام دهید.", "هر مصدوم با آسیب‌دیدگی ناحیه‌ی توراکس در معرض خطر است، به‌ویژه آن‌هایی که پنوموتوراکس احتمالی (مثل شکستگی دنده) یا آشکار (زخم نافذ) دارند یا تحت تهویه با فشار مثبت هستند."], "##اقدامات", ["ABC، کولار، اکسیژن یا BMV، اینتوباسیون در صورت نیاز؛ راه وریدی و پیشگیری از هیپوترمی؛ پوزیشن نیمه‌نشسته (در صورت نبود مانع).", "توراکوسنتز و دکمپرس سوزنی (جزئیات در بخش ۸).", "پایش مداوم دیسترس و شوک؛ در صورت عود علائم، دکمپرس مجدد و در صورت لزوم لوله‌گذاری تراشه.", "پایش از نظر آمفیزم زیرجلدی؛ مصدوم را سریعاً برای تعبیه‌ی چست‌تیوب منتقل کنید."], "##د) هموتوراکس", ["تجمع خون در فضای پلور است. فضای جنب می‌تواند ۲۵۰۰ تا ۳۰۰۰ میلی‌لیتر خون در خود جای دهد، پس منبع مهمی برای خونریزی و شوک هموراژیک است. منشأ خونریزی: پارانشیم ریه، دیواره‌ی قفسه سینه، عروق بین‌دنده‌ای، عروق ریوی یا عروق بزرگ.", "هموتوراکس به‌ندرت آن‌قدر خون جمع می‌کند که «هموتوراکس فشاری» شود، اما هیپوولمی ناشی از آن از کلاپس ریه خطرناک‌تر است. ممکن است همراه پنوموتوراکس باشد (هموپنوموتوراکس) که کار قلب و ریه را بیشتر مختل می‌کند.", "علائم: علائم ترومای نافذ یا بلانت، تنگی نفس، کاهش صداهای تنفسی و صدای کند (Dull) در دق سمت گرفتار، افت فشار خون، تاکی‌کاردی و نبض ضعیف، نبض پارادوکس، پوست سرد، مرطوب و رنگ‌پریده، شوک و احتمال ایست قلبی.", "اقدام: ABC و کولار، اکسیژن و BMV، تعبیه‌ی دو راه وریدی بزرگ و سرم‌درمانی در صورت علائم شوک، پیشگیری از هیپوترمی، پوزیشن نیمه‌نشسته (در صورت نبود مانع)، پایش مکرر از نظر پنوموتوراکس فشارنده (هموپنوموتوراکس)، انتقال سریع به بیمارستان برای تعبیه‌ی چست‌تیوب."]]}, {"h": "۵) آسیب‌های پارانشیم ریه و خفگی تروماتیک", "b": ["##الف) کانتیوژن (کوفتگی) ریه", ["با ترومای نافذ یا بلانت، بافت پارانشیم پاره می‌شود و خونریزی داخل بافت و آلوئول‌ها رخ می‌دهد. خون و مایع بین آلوئول‌ها مانع تبادل گاز در آلوئول‌های سالم هم می‌شود.", "در آسیب‌های شدید توراکس، به‌ویژه همراه فلیل‌چست، عارضه‌ای شایع و بالقوه کشنده است. طی ۲۴ ساعت بعد، به‌تدریج در اثر آنوکسی و تغییر نفوذپذیری بافتی، مایع در فضای بین‌بافتی و آلوئول‌ها جمع می‌شود و نارسایی تنفسی واضح یا ARDS ایجاد می‌شود.", "ارزیابی اولیه ممکن است مشکل تنفسی چندانی نشان ندهد؛ با شک بالا، به‌ویژه با حضور فلیل‌چست، به آن فکر کنید.", "علائم: نشانه‌های ترومای نافذ یا بلانت، درد شدید قفسه سینه، دیسپنه و تاکی‌پنه شدید، نارسایی حاد تنفسی، سیانوز، هموپتیزی یا خلط خونی.", "اقدام: ABC و کولار، اکسیژن و BMV و اینتوباسیون در صورت نیاز، راه وریدی، پوزیشن نیمه‌نشسته، توجه به آسیب‌های همراه (پنوموتوراکس، هموتوراکس) و شوک، انتقال سریع. در نبود اختلال همودینامیک، مایع وریدی را در حد باز نگه داشتن رگ (KVO) محدود کنید؛ مایع اضافی ادم و ARDS را بدتر کرده و اکسیژناسیون را مختل می‌کند."], "##ب) خفگی (آسفیکسی) تروماتیک", ["معمولاً بر اثر بالا رفتن ناگهانی فشار داخل توراکس به دلیل ضربه به تنه (مثلاً افتادن خودرو روی سینه) رخ می‌دهد. خون داخل قلب به دلیل فشار، به وریدهای سر و گردن برمی‌گردد؛ فشار وریدی بالا منتقل می‌شود، مویرگ‌ها و ونول‌های کوچک پاره می‌شوند و خونریزی‌های ریز زیر پوست ایجاد می‌شود. نتیجه: پوست گردن، صورت و شانه‌ها آبی‌بنفش می‌شود. عملکرد مغز و چشم هم ممکن است مختل شود. می‌تواند نشانه‌ی پارگی قلب در اثر ترومای بلانت باشد.", "علائم: تغییر رنگ پوست صورت، گردن و شانه‌ها به آبی‌بنفش (Plethora)، آبی شدن و تورم لب‌ها و زبان، اتساع وریدهای گردنی، خونریزی داخل اسکلرای چشم، دیسترس شدید تنفسی، شوک شدید به دلیل فشار بر قلب.", "اقدام: ABC و کولار، اکسیژن و BMV و اینتوباسیون در صورت نیاز، آمادگی شوک، پیشگیری از هیپوترمی، تعبیه‌ی دو راه وریدی بزرگ و سرم‌درمانی؛ مصدوم را سریعاً به مرکز درمانی مناسب منتقل کنید."]]}, {"h": "۶) آسیب‌های قلب، عروق بزرگ و دیافراگم", "b": ["##مکانیسم", "آسیب‌های قلبی اغلب پس از ضربه به قسمت قدامی قفسه سینه (مثلاً برخورد با فرمان در تصادف از جلو) ایجاد می‌شوند. قلب بین جناغ (جلو) و ستون فقرات (عقب) فشرده می‌شود و فشار داخل بطن‌ها ناگهان چند برابر می‌شود؛ نتیجه می‌تواند کوفتگی قلب، آسیب دریچه‌ای و به‌ندرت پارگی قلب باشد.", "##الف) کوفتگی میوکارد", ["شایع‌ترین آسیب قلبی در تروما است. سلول‌های عضله‌ی قلب آسیب می‌بینند؛ ریتم‌های غیرطبیعی مثل تاکی‌کاردی سینوسی شایع‌ترین‌اند؛ PVC، VT و VF ناشایع ولی خطرناک‌اند. اگر آسیب در سپتوم باشد، ECG اختلال هدایتی مثل بلوک شاخه‌ی راست (RBBB) نشان می‌دهد.", "اگر آسیب وسیع باشد، قدرت انقباضی قلب افت می‌کند و شوک کاردیوژنیک رخ می‌دهد؛ برخلاف شوک‌های معمول تروما، این شوک با مایع‌درمانی بهتر نمی‌شود و حتی ممکن است بدتر شود.", "آسیب دریچه‌ها می‌تواند علائم نارسایی احتقانی قلب (CHF) ایجاد کند: تاکی‌پنه، رال ریوی، سوفل قلبی، هیپوتانسیون، دیستانسیون ژوگولار.", "پارگی بافت قلب عارضه‌ی نادری است؛ حدود ۱۰ درصد مصدومان ترومای بلانت به این ناحیه دچار می‌شوند و بیشتر آن‌ها بلافاصله می‌میرند؛ بقیه دچار تامپوناد می‌شوند."], "##علائم کوفتگی میوکارد", ["علائم بالینی ترومای قفسه سینه (درد، تندرنس، کبودی) و نشانه‌های کینماتیک مثل خم‌شدگی فرمان", "علائم آسیب جناغ: کبودی، کریپتاسیون و ناپایداری؛ در «فلیل استرنوم» دنده‌های دو طرف جناغ می‌شکنند و جناغ همزمان با تنفس حرکت پارادوکس دارد", "تنگی نفس، نبض نامنظم، اختلال هدایتی، آریتمی (تاکی‌کاردی، PVC و گاهی VT و VF) و بالا رفتن قطعه‌ی ST", "در آسیب دریچه‌ای: سوفل خشن در ناحیه‌ی پره‌کوردیال و علائم نارسایی احتقانی قلب"], "##اقدامات", ["ABC، کولار، اکسیژن یا BMV و اینتوباسیون در صورت نیاز؛ آمادگی شوک، پیشگیری از هیپوترمی، تعبیه‌ی دو راه وریدی بزرگ.", "مایع‌درمانی را با توجه به وضعیت نارسایی قلبی انجام دهید.", "پوزیشن نیمه‌نشسته (در نبود مانع)", "مانیتورینگ قلبی مداوم و در صورت امکان ECG ۱۲ لید", "در دیس‌ریتمی کشنده، اقدامات احیا را فوراً شروع کنید؛ در ایست قلبی CPR را آغاز کنید.", "آسیب‌های همراه و شوک را مدنظر داشته باشید و صداهای قلبی را از نظر گالوپ یا سوفل مرتب کنترل کنید.", "مصدوم را سریعاً به مرکز درمانی مجهز و مناسب منتقل کنید."], "##ب) تامپوناد قلبی (Cardiac tamponade)", ["معمولاً حاصل ترومای نافذ (ضربه‌ی چاقو، تیرخوردگی، اصابت جسم نوک‌تیز) است؛ سوراخ شدن یک حفره‌ی قلب یا زخم میوکارد باعث تجمع خون بین قلب و کیسه‌ی پریکارد می‌شود. پریکارد از بافت فیبروزی غیرالاستیک ساخته شده، پس حتی مقدار کمی خون حاد باعث بالا رفتن سریع فشار داخل کیسه می‌شود. نتیجه: اختلال برگشت وریدی، کاهش برون‌ده قلبی و فشار خون و در نهایت PEA (فعالیت الکتریکی بدون نبض).", "در هر مصدوم با ترومای نافذ توراسیک احتمال تامپوناد را در نظر بگیرید. اگر زخم نافذ به ناحیه‌ی «قاب قلب» (مستطیلی که ضلع افقی بالا موازی ترقوه‌هاست، دو ضلع عمودی از نوک سینه‌ها پایین می‌آیند و ضلع افقی پایین مرز تحتانی دنده‌هاست) برسد، باید فرض کرد تامپوناد وجود دارد، مگر خلافش ثابت شود. این آسیب را فوراً به مرکز تحویل‌گیرنده اطلاع دهید."], "##علائم", ["علائم ترومای قفسه سینه، به‌ویژه در ناحیه‌ی قاب قلب", "تریاد بک (Beck): ۱) صداهای قلبی ضعیف (مایع اطراف قلب)، ۲) اتساع وریدهای ژوگولار (به دلیل پس‌زدن خون در وریدهای گردنی)، ۳) کاهش فشار خون", "نبض پارادوکس: افت فشار سیستولیک بیش از ۱۰ میلی‌متر جیوه در زمان دم (در حالت طبیعی کمتر از ۱۰ تا ۱۵ است)", "افت شدید فشار خون با علائم شوک: تاکی‌کاردی، نبض ضعیف، پوست سرد و مرطوب؛ در ادامه ایست قلبی", "تغییرات ECG: کاهش ولتاژ اشتقاق‌های اندامی و در افیوژن حجیم تغییر اندازه‌ی QRS", "در صحنه، شناسایی ضعیف شدن صداهای قلبی و نبض پارادوکس آسان نیست؛ بر اساس محل آسیب و وجود هیپوتانسیون به تامپوناد شک کنید."], "##اقدامات", ["ABC، کولار، اکسیژن، BMV و اینتوباسیون در صورت نیاز؛ آمادگی شوک، پیشگیری از هیپوترمی و تعبیه‌ی دو راه وریدی بزرگ.", "مایع را تا حدی تزریق و احیا کنید که فشار خون مصدوم در حدود ۸۰ تا ۹۰ میلی‌متر جیوه حفظ شود؛ این کار فشار وریدی را بالا برده و پرشدگی قلب را موقتاً بهتر می‌کند.", "مانیتورینگ مداوم علائم حیاتی و پایش شوک", "پریکاردیوسنتز درمان موقتی از راه پوست است (تخلیه‌ی مقداری از مایع پریکارد با سوزن مخصوص). درمان قطعی ترمیم جراحی محل آسیب است.", "مصدوم را سریعاً برای پریکاردیوسنتز و درمان نهایی به مرکز درمانی مناسب منتقل کنید."], "##ج) پارگی تروماتیک شریان آئورت", ["بر اثر کاهش یا افزایش ناگهانی شتاب (ضربه از جلو در تصادف پرسرعت، سقوط از بلندی) ایجاد می‌شود. قلب و قوس آئورت نسبتاً متحرک‌اند، ولی آئورت نزولی به ستون مهره‌ها چسبیده است؛ نیروی برشی در حد فاصل این دو بخش (محل لیگامان آرتریوزوم) وارد می‌شود و آئورت را پاره می‌کند.", "اگر پارگی تمام ضخامت را بگیرد، خونریزی فاجعه‌بار و مرگ فوری است؛ اگر فقط بخشی از دیواره را درگیر کند و لایه‌ی خارجی سالم بماند، مصدوم مدتی زنده می‌ماند و امکان تشخیص و درمان وجود دارد.", "علائم: شواهد کینماتیک کاهش یا افزایش سریع شتاب (شک مهم‌ترین نکته است؛ اغلب اثر خارجی چندانی نیست)، سوزش یا درد قفسه سینه و شانه‌ها، تفاوت کیفیت نبض بین دو اندام فوقانی یا بین اندام فوقانی و تحتانی، افت ناگهانی فشار خون و افزایش ناگهانی نبض، افت سریع سطح هوشیاری. اغلب مرگ فوری رخ می‌دهد.", "تشخیص قطعی با مطالعات رادیولوژیک انجام می‌شود؛ عریض شدن مدیاستن قابل‌اعتمادترین علامت است و آئورتوگرافی، CT قفسه سینه و اکوکاردیوگرافی ترانس‌ازوفاژیال تشخیص را قطعی می‌کنند.", "اقدام: ABC و کولار، اکسیژن و BMV، دو راه وریدی بزرگ، تجویز و احیای مایعات تا حدی که فشار خون مصدوم حدود ۸۰ میلی‌متر جیوه حفظ شود (از بالا بردن فشار خون بپرهیزید)، مانیتورینگ مداوم علائم حیاتی و شوک. کنترل دقیق فشار خون در نتیجه‌ی نهایی تأثیر زیادی دارد. مصدوم را فوراً به مرکز درمانی مجهز منتقل کنید."], "##د) پارگی دیافراگم", ["بر اثر ترومای بلانت (ضربه‌ی شدید به شکم که فشار داخل شکم را ناگهان بالا می‌برد؛ پارگی بزرگ و فتق فوری احشا به قفسه سینه) یا ترومای نافذ (پارگی کوچک‌تر) ایجاد می‌شود. چون دیافراگم در تنفس بالا و پایین می‌رود، هر زخم نافذ زیر خط نوک‌پستان در جلو و نوک اسکاپولا در عقب خطر اصابت به آن را دارد. پارگی‌های کوچک فوراً مشکل ایجاد نمی‌کنند اما باید ترمیم شوند، چون در آینده خطر فتق و اختناق احشا وجود دارد.", "علائم: علائم ترومای قفسه سینه یا شکم (به‌ویژه ناحیه‌ی توراکو‌ابدومینال)، کوفتگی، کریپتاسیون استخوانی و آمفیزم زیرجلدی؛ دیسترس تنفسی حاد و تنگی نفس و تاکی‌پنه به دلیل نفوذ احشا؛ کاهش صداهای تنفسی در سمت درگیر و امکان سمع صداهای شکمی در قفسه سینه؛ علائم شوک (افت فشار، تاکی‌کاردی)؛ احتمال پنوموتوراکس و هموتوراکس؛ احتمال آسیب آئورت.", "اقدام: ABC و کولار، اکسیژن و BMV و اینتوباسیون در صورت نیاز، دو راه وریدی بزرگ، مایع تا حفظ فشار خون در حدود ۸۰ میلی‌متر جیوه، مانیتورینگ علائم حیاتی، کنترل پنوموتوراکس و هموتوراکس و شوک، کنترل مکرر و دقیق علائم حیاتی، تعبیه‌ی لوله‌ی بینی ـ معده برای کاهش فشار احشا (طبق دستور و در صورت امکان) و انتقال سریع به مرکز درمانی مجهز."]]}, {"h": "۷) رویکرد پیش‌بیمارستانی به مصدوم ترومای قفسه سینه", "b": ["##۱) ایمنی و ارزیابی صحنه", ["احتیاطات BSI: دستکش لاتکس، و هنگام ونتیلاسیون یا خطر پاشش، عینک محافظ و ماسک.", "ایمنی خود، تیم و صحنه (خطر انفجار، تصادف مجدد و ...) را تضمین کنید؛ در صورت نیاز پلیس و آتش‌نشانی را در صحنه داشته باشید.", "مکانیسم آسیب (کینماتیک) را از صحنه و شاهدان بررسی کنید و به مرکز مقصد گزارش دهید.", "در صورت تعداد زیاد مصدومان یا نیاز به رهاسازی، آمبولانس اضافه و نیروهای امدادی (هلال‌احمر، آتش‌نشانی) درخواست کنید.", "با حفظ ثبات ستون فقرات، پوزیشن مناسب (طاقباز) بدهید."], "##۲) ارزیابی اولیه (AcBCDE)", ["ابتدا سطح هوشیاری را با AVPU تعیین کنید؛ کاهش یا عدم پاسخ نشانه‌ی مشکل تهدیدکننده‌ی حیات است.", "Airway: با تکلم نرمال مصدوم و نبود صداهای غیرطبیعی (خرخر، غرغره، استریدور) راه هوایی باز است. در کاهش هوشیاری Jaw thrust یا Chin lift؛ ساکشن خون و ترشحات؛ خارج کردن جسم خارجی؛ نگه داشتن راه هوایی با OPA و NPA؛ در صورت شکست، ETT یا LMA.", "C (Collar): در مصدومان با علائم آسیب ستون فقرات یا تغییر سطح هوشیاری، ابتدا سر و گردن را با دست بی‌حرکت کنید، سپس کولار بزنید و تا ثابت‌سازی کامل روی بک‌بورد با ایموبیلایزر، بی‌حرکتی را با دست حفظ کنید."], "##Breathing: نگاه، گوش دادن و لمس", ["نگاه (Look): بالا و پایین رفتن قفسه سینه؛ در آپنه فوراً BMV. زخم نافذ و مکنده، کبودی، حرکت متناقض، انحراف تراشه، برجستگی ژوگولار.", "تعداد تنفس: برادی‌پنه کمتر از ۱۲، تاکی‌پنه ۲۰ تا ۳۰ و تنفس خیلی تند بیش از ۳۰ در دقیقه. در این حالت‌ها ابتدا اکسیژن کمکی با ماسک و در صورت عدم اصلاح فوراً BMV.", "عمق تنفس: تنفس سطحی (Shallow) هم ابتدا اکسیژن با ماسک و در صورت عدم اصلاح BMV.", "گوش دادن (Listen): ریه‌ها را با گوشی از نظر صداهای نرمال و مساوی یا نامساوی (Equal / Un-equal)، ویز و رال بررسی کنید. پنوموتوراکس، پنوموتوراکس فشاری، هموتوراکس و کانتیوژن ریه صداهای تنفسی را کم می‌کنند.", "لمس (Feel): قفسه سینه را در معرض دید بگیرید و از نظر تندرنس، کریپتوس و آمفیزم زیرجلدی لمس کنید.", "اکسیژن: در همه‌ی مصدومان ترومای قفسه سینه، صرف‌نظر از SpO2، با ماسک ساده ۸ تا ۱۰ لیتر در دقیقه یا ماسک ذخیره‌دار ۱۰ تا ۱۵ لیتر در دقیقه شروع کنید؛ اشباع حداقل ۹۰٪ و مطلوب ۹۵٪ یا بیشتر. اگر مصدوم تنفس کند، تند یا سطحی و غیرمؤثر دارد و با ماسک بهتر نشد، تهویه با BMV و در صورت امکان اینتوباسیون.", "اندیکاسیون‌های لوله‌گذاری: دیسترس تنفسی فزاینده یا نارسایی تنفسی قریب‌الوقوع (پس از رد یا درمان پنوموتوراکس فشاری)، فلیل‌چست، پنوموتوراکس باز و شکستگی چندگانه‌ی دنده‌ها. در انتقال‌های طولانی، لوله‌گذاری را هر چه زودتر مدنظر قرار دهید.", "هر مصدوم با ترومای قابل‌توجه توراکس در معرض پنوموتوراکس فشاری است؛ حین انتقال مکرر ارزیابی کنید. با کاهش یا فقدان صداهای تنفسی، بدتر شدن دیسترس و هیپوتانسیون، دکمپرس سوزنی الزامی است."], "##Circulation: ارزیابی و حفظ گردش خون", ["خونریزی خارجی را فوراً با فشار مستقیم و تورنیکه کنترل کنید (اولویت دارد) و به خونریزی داخلی هم فکر کنید.", "نبض: ابتدا رادیال. اگر در اندام سالم لمس نشود، احتمالاً شوک غیرجبرانی است. اگر رادیال نبود، کاروتید و فمورال؛ اگر هیچ‌کدام لمس نشد، ایست قلبی. در صورت وجود نبض رادیال، سرعت (سریع، نرمال، کند) و قدرت (قوی، ضعیف) را بررسی کنید؛ نبض سریع و ضعیف یعنی از دست رفتن حجم خون.", "پوست: رنگ (صورتی = پرفیوژن خوب؛ رنگ‌پریده = کاهش پرفیوژن؛ کبود = عدم کفایت اکسیژن‌رسانی)، درجه‌ی حرارت (با پشت دست؛ سرد = کاهش پرفیوژن)، رطوبت (مرطوب = شوک) و پرشدگی مویرگی (بیش از ۲ ثانیه = پرفیوژن ناکافی).", "در شوک ترومای قفسه سینه، علاوه بر شوک هموراژیک، شوک انسدادی (تنشن پنوموتوراکس و تامپوناد) را هم مدنظر داشته باشید."], "##مدیریت و درمان شوک", ["تعبیه‌ی یک یا دو راه وریدی مطمئن با آنژیوکت بزرگ.", "جایگزینی مایع با کریستالوئید؛ در شوک هموراژیک رینگر لاکتات بهترین است؛ نرمال سالین هم قابل‌استفاده است ولی ممکن است هایپرکلرمی و اسیدوز ایجاد کند.", "ابتدا ۱ لیتر مایع تجویز کنید، بالینی مصدوم را ارزیابی کنید؛ اگر علائم شوک تا حدی برطرف شد (نبض رادیال لمس می‌شود یا فشار سیستولیک بیش از ۹۰) مایع را قطع کنید؛ اگر باقی بود، ۱ لیتر دیگر.", "تجویز بی‌احتیاطانه‌ی مایع در خونریزی غیرقابل‌کنترل داخلی می‌تواند با بالا بردن فشار خون و کنده شدن لخته، خونریزی و مرگ را تشدید کند.", "مایع‌درمانی بیش از حد کوفتگی ریه را وخیم می‌کند؛ در کوفتگی میوکارد هم باید با توجه به وضعیت قلب انجام شود.", "پیشگیری از هیپوترمی با پتو، و در صورت نیاز ثابت‌سازی شکستگی‌های بزرگ (فمور و لگن)."], "##Disability و Exposure", ["Disability: سطح هوشیاری (AVPU یا GCS)، مردمک‌ها از نظر اندازه، تقارن و واکنش به نور (مردمک‌های نامساوی در مصدوم بیهوش ممکن است نشانه‌ی افزایش فشار داخل جمجمه باشد؛ اتساع مردمک می‌تواند ناشی از هیپوکسی شدید مغز و یا بعضی داروها باشد) و ارزیابی حس و حرکت اندام‌ها. کاهش سطح هوشیاری را تا اثبات خلاف، ناشی از هیپوکسی بدانید.", "Exposure: با حفظ حریم خصوصی مصدوم را برهنه کنید و همه‌ی بدن را از نظر آسیب‌های مخفی بررسی کنید (قفسه سینه، شکم، لگن، اندام‌ها)؛ برای دیدن پشت، Log roll انجام دهید (مثلاً هنگام گذاشتن تخته).", "پیشگیری از هیپوترمی: لباس خیس یا آغشته به خون را در بیاورید، با پتوی گرم یا ملافه‌ی پلاستیکی بپوشانید، در صورت امکان از اکسیژن گرم و مرطوب استفاده کنید و کابین آمبولانس را گرم نگه دارید (حدود ۲۹ درجه‌ی سانتی‌گراد)."], "##۳) انتقال و تصمیم‌گیری", ["پس از تصحیح مشکلات راه هوایی و اکسیژن‌رسانی و کنترل خونریزی خارجی، مصدوم را روی تخته‌ی پشتی بلند و عنکبوتی ثابت کنید و به آمبولانس منتقل کنید.", "اگر مصدوم بحرانی است (کاهش هوشیاری، اختلال در ABC)، فوراً شرایط انتقال را فراهم کنید و بقیه‌ی اقدامات را در مسیر انجام دهید.", "در صورت امکان، مصدومان ترومای قفسه سینه را مستقیماً به مرکز ترومایی مجهز به چست‌تیوب و جراح منتقل کنید؛ اگر در دسترس نبود، انتقال هوایی را مدنظر قرار دهید."], "##۴) ارزیابی ثانویه و ادامه‌ی مراقبت", ["شرح‌حال مجدد با SAMPLE از مصدوم، همراهان یا شاهدان؛ کنترل علائم حیاتی (RR، BP، PR، SpO2 و قند خون)؛ معاینه‌ی دقیق سر تا پا.", "آتل‌گیری اندام‌ها، شستشو و پانسمان زخم‌های بدون خونریزی خارجی.", "برای مصدوم با GCS غیرطبیعی قند خون را چک کنید؛ در هایپوگلایسمی طبق دستور دکستروز تزریق شود.", "CBR کردن و آرام کردن مصدوم؛ پوزیشن طاقباز مناسب‌ترین و ثابت‌ترین وضعیت است؛ در مصدوم هوشیار بدون علائم آسیب ستون فقرات، نشسته یا نیمه‌نشسته هم قابل‌قبول است. تسکین درد با مسکن در صورت امکان."], "##۵) ارزیابی مجدد، ارتباط و مستندسازی", ["مرتب (حین اعزام) سطح هوشیاری (افت GCS را گزارش دهید)، تنفس (افزایش، کاهش یا نامنظم بودن)، نبض، فشار خون (افزایش فشار سیستولیک و پهن شدن فشار نبض) و در صورت کاهش هوشیاری مردمک‌ها (دیلاته شدن، واکنش به نور) را کنترل کنید.", "با مرکز مقصد (مستقیم یا از طریق دیسپچ) ارتباط بگیرید: مکانیسم حادثه، GCS و علائم حیاتی اولیه، تغییر وضعیت در مسیر، علائم موضعی، سایر آسیب‌های خطیر و پاسخ به اقدامات.", "تمام یافته‌ها را در برگه‌ی ماموریت ثبت کنید و خلاصه‌ی وضعیت را شفاهی اعلام کنید."]]}, {"h": "۸) دکمپرسیون سوزنی (Needle decompression) در پنوموتوراکس فشارنده", "b": ["مراحل اجرا طبق جزوه:", ["۱) طبق هماهنگی با پزشک مرکز، کسب دستور کنید.", "۲) وسایل را آماده کنید: کاتتر داخل‌وریدی بزرگ (ترجیحاً شماره ۱۴ و ۱۶ در بزرگسالان و شماره ۱۸ در اطفال، با طول حداقل ۵ سانتی‌متر؛ چون ضخامت متوسط دیواره‌ی قفسه سینه حدود ۴ تا ۵ سانتی‌متر است)، سرنگ ۱۰ سی‌سی، وسیله برای ایجاد دریچه‌ی فلوتر یک‌طرفه (وسیله‌ی تجاری یا یک انگشت دستکش پزشکی)، لیدوکائین برای بی‌حسی موضعی، نوارچسب برای فیکس کردن کاتتر، الکل یا بتادین.", "۳) مصدوم را طاقباز بخوابانید و در صورت امکان دست‌ها را به سمت بالای سر ببرید تا بافت‌های محل کشیده و نازک‌تر شوند.", "۴) محل مناسب: فضای بین‌دنده‌ای دوم یا سوم در خط میدکلاویکولار (وسط ترقوه) در سمت گرفتار. این ناحیه به‌دلیل دسترسی آسان و نبود مزاحمت بازوها انتخاب می‌شود. برای پیدا کردن فضای دوم، از بالای جناغ پایین بیایید؛ قسمت برجسته‌ی جناغ (زاویه‌ی استرنال) به دنده‌ی دوم وصل است و فضای دوم درست زیر آن است. خط میدکلاویکولار در مردان خط فرضی از نوک‌پستان تا وسط ترقوه است. به دلیل ناودان عروقی ـ عصبی زیر دنده، سوزن را از روی دنده‌ی سوم (فضای دوم و سوم) یا چهارم (فضای چهارم و پنجم) عبور دهید.", "۵) محل را با بتادین یا الکل ضدعفونی کنید.", "۶) درپوش یا دربند انتهای کاتتر را جدا کنید و سرنگ ۱۰ سی‌سی را به آن وصل کنید.", "۷) سوزن را با زاویه‌ی ۹۰ درجه و عمود بر پوست از روی دنده‌ی سوم یا چهارم وارد کنید و فشار دهید تا صدای POP حس شود (ورود به فضای جنب). با ورود به فضای جنب، پیستون سرنگ به‌کمک فشار هوا به عقب کشیده می‌شود.", "۸) پس از ورود کاتتر، هوا را آسپیره کنید؛ وجود هوا در پیستون یعنی نوک کاتتر در فضای جنب است. کاتتر را از طریق سوزن پیش ببرید تا هم‌تراز پوست شود و سپس سوزن را بردارید.", "۹) با اطمینان از قرارگیری درست و خروج هوا و کاهش علائم، کاتتر را با چسب محکم فیکس کنید تا جابه‌جا نشود و تا رسیدن به مرکز درمانی حفظ کنید. قرارگیری نامناسب (از نظر عمق) ممکن است به ریه‌ها، قلب یا عروق بزرگ آسیب بزند.", "۱۰) مصدوم را از نظر عود علائم پایش کنید و در صورت لزوم تا رسیدن به بیمارستان تکرار کنید."], "##نکات", ["اگر با وجود جای‌گذاری درست بهبود حاصل نشد، ممکن است کاتتر اول کفایت کافی نداشته باشد (یا کوتاه بوده، یا بعد از کشیدن سوزن تا خورده/پیچ‌خورده باشد)؛ می‌توان کاتتر دیگری کنار آن گذاشت. کاتتر سایز بزرگ (حدود ۸/۵ فرنچ) با سیم تقویت‌کننده هم وجود دارد که احتمال پیچ‌خوردگی را کم می‌کند.", "پنوموتوراکس فشاری دوطرفه در مصدومانی که اینتوبه نیستند و با فشار مثبت تهویه نمی‌شوند بسیار نادر است؛ قبل از دکمپرس دوطرفه با احتیاط ارزیابی کنید، چون اگر ارزیابی اشتباه باشد، دکمپرس دوطرفه می‌تواند دیسترس شدید ایجاد کند. در مصدوم اینتوبه، ابتدا جای لوله‌ی تراشه (پیچ‌خوردگی یا ورود به یک برونش اصلی) را بررسی کنید.", "برای ایجاد دریچه‌ی یک‌طرفه، آنژیوکت را از میان انگشت دستکش عبور دهید تا دریچه‌ی فلوتر یا هایملیخ (Heimlich) ساخته شود؛ اگر در دسترس بود از کاندوم یا وسیله‌ی تجاری هم می‌توان استفاده کرد.", "در بعضی مراجع درباره‌ی باز گذاشتن نوک سوزن یا ایجاد دریچه اختلاف نظر وجود دارد؛ بعضی لزومی نمی‌بینند چون این سوراخ در حدی نیست که تنفس را مختل کند و خطر پنوموتوراکس فشارنده‌ی مجدد خطرناک‌تر از سوراخ کوچک است."]]}, {"h": "۹) نکات تکمیلی از مراجع (Tintinalli، Brady/Mistovich، PHTLS، ATLS)", "b": ["این بخش مطالبی است که علاوه بر جزوه از مراجع اورژانس اضافه شده است. در هر مورد که با پروتکل ابلاغی یا دستور پزشک مرکز تفاوت داشت، آن ملاک عمل است.", "##حفظ کنید: شش تهدید فوری حیات (ATOM FC)", ["Airway obstruction (انسداد راه هوایی)", "Tension pneumothorax (پنوموتوراکس فشارنده)", "Open pneumothorax (پنوموتوراکس باز)", "Massive hemothorax (هموتوراکس ماسیو)", "Flail chest (قفسه سینه‌ی شناور)", "Cardiac tamponade (تامپوناد قلبی)", "این‌ها در ارزیابی اولیه شناسایی و فوراً درمان می‌شوند. آسیب‌های «بالقوه کشنده» که در ارزیابی ثانویه دنبال می‌شوند: پنوموتوراکس ساده، هموتوراکس، کوفتگی ریه، آسیب درخت تراکئوبرونشیال، آسیب بلانت قلب، پارگی آئورت، پارگی دیافراگم و پارگی مری."], "##تمایز سه وضعیت شایع شوک انسدادی و هموراژیک", ["تنشن پنوموتوراکس: صداهای تنفسی کم یا قطع‌شده + هایپررزونانس در دق + اتساع ژوگولار + انحراف تراشه (دیررس).", "هموتوراکس ماسیو: صداهای تنفسی کم + صدای کند (Dull) در دق + وریدهای گردنی معمولاً خالی (هیپوولمی).", "تامپوناد قلبی: صداهای ریه نرمال و دوطرفه مساوی + صداهای قلبی ضعیف + اتساع ژوگولار + نبض پارادوکس؛ معمولاً پس از ترومای نافذ ناحیه‌ی قاب قلب.", "در هر سه، هیپوتانسیون و تاکی‌کاردی دیده می‌شود؛ تمایز مهم است چون درمان فرق می‌کند (دکمپرس سوزنی، مایع و انتقال برای چست‌تیوب، انتقال سریع برای درمان جراحی)."], "##پنوموتوراکس و دکمپرسیون سوزنی", ["در راهنماهای جدیدتر (از جمله ATLS، PHTLS و TCCC) به دلیل ضخامت بیشتر دیواره‌ی قفسه سینه در بعضی بیماران و شکست بیشتر کاتتر کوتاه، استفاده از کاتتر بلندتر (حدود ۸ سانتی‌متر) و محل جایگزین یعنی فضای ۴ تا ۵ بین‌دنده‌ای در خط قدامی ـ میدآگزیلاری (قدام خط میانی زیربغل) هم توصیه می‌شود. پروتکل ابلاغی ملاک عمل است.", "انتقال مصدوم را به‌خاطر انجام دکمپرسیون یا اقدامات غیرضروری به تأخیر نیندازید؛ در ترومای شدید، زمان ماندن در صحنه باید کوتاه باشد (حدود ۱۰ دقیقه یا کمتر، «Platinum 10 minutes» در PHTLS).", "درمان قطعی در بیمارستان: چست‌تیوب (یا توراکوستومی انگشتی در مصدومان تحت تهویه‌ی فشار مثبت یا در حال احیا). با چست‌تیوب، بیشتر پنوموتوراکس‌ها کامل درمان می‌شوند.", "پنوموتوراکس باز: درپوش‌های تجاری با دریچه (Vented) مناسب‌اند؛ درپوش بدون دریچه ممکن است باعث تجمع هوا و پنوموتوراکس فشارنده شود. در صورت بدتر شدن بیمار پس از پوشاندن زخم، درپوش را برای لحظه‌ای باز کنید.", "نشت مداوم هوا پس از چست‌تیوب، باز نشدن ریه، آمفیزم زیرجلدی گسترده یا هموپتیزی: آسیب تراکئوبرونشیال (نای و برونش) را در نظر بگیرید (نیاز به برونکوسکوپی و گاهی اینتوباسیون انتخابی)."], "##هموتوراکس", ["در بیمارستان: خروج اولیه‌ی بیش از ۱۵۰۰ میلی‌لیتر خون از چست‌تیوب، یا خروج بیش از ۲۰۰ میلی‌لیتر در ساعت در ۲ تا ۴ ساعت، اندیکاسیون توراکوتومی است.", "در هموتوراکس، دکمپرسیون سوزنی معمولاً بی‌اثر است؛ درمان خون است نه هوا. بنابراین در مصدوم با صداهای تنفسی کم و صدای کند در دق، به جای دکمپرس به مایع‌درمانی و انتقال فکر کنید.", "در شوک هموراژیک ترومایی، اهداف مایع‌درمانی کنترل‌شده (هیپوتانسیون مجاز با فشار سیستولیک حدود ۸۰ تا ۹۰ و نبض رادیال لمس‌شونده) است؛ استثنا: آسیب مغزی همراه که در آن هیپوتانسیون ممنوع است."], "##شکستگی دنده و قفسه‌ی شناور", ["در سالمندان هر دنده‌ی شکسته خطر پنومونی و مرگ را بالا می‌برد؛ حتی شکستگی‌های ساده را جدی بگیرید و مسکن کافی بدهید (کنترل درد خوب از پنومونی و نارسایی تنفسی پیشگیری می‌کند).", "در قفسه‌ی شناور، مشکل اصلی درد و کوفتگی زیرین ریه است، نه خود حرکت پارادوکس؛ تهویه با فشار مثبت (BMV) مثل یک آتل داخلی عمل می‌کند. پایدارسازی خارجی با چسب یا کیسه‌ی شن توصیه نمی‌شود.", "اینتوباسیون و تهویه‌ی مکانیکی در بیمار با هایپوکسی علی‌رغم اکسیژن، خستگی تنفسی و افزایش CO2 اندیکاسیون دارد.", "شکستگی دنده‌های ۱ تا ۳ در بیمار با کینماتیک شدید: به آسیب عروق بزرگ و آئورت فکر کنید؛ دنده‌های ۹ تا ۱۲: به آسیب کبد، طحال و کلیه فکر کنید."], "##کوفتگی ریه", ["علائم ممکن است در ۲۴ تا ۷۲ ساعت اول بدتر شود و در رادیوگرافی اولیه ممکن است واضح نباشد؛ بیمار را حتی در ظاهر پایدار هم زیر نظر بگیرید. مایع اضافی را محدود کنید و اکسیژن‌رسانی را حفظ کنید."], "##آسیب بلانت قلب و کوموسیو کوردیس", ["غربالگری با ECG (و در بیمارستان تروپونین) انجام می‌شود؛ ECG طبیعی همراه با تروپونین طبیعی، آسیب مهم قلبی را بسیار بعید می‌کند. شکستگی جناغ به‌تنهایی پیش‌بینی‌کننده‌ی آسیب قلبی نیست، ولی مانیتورینگ لازم است.", "کوموسیو کوردیس (Commotio cordis): ضربه‌ی غیرنافذ و بی‌ضرر ظاهری روی قفسه سینه (مثلاً توپ بیسبال یا ضربه‌ی ورزشی) در لحظه‌ی آسیب‌پذیر چرخه‌ی قلب (فاز صعودی موج T) باعث VF می‌شود؛ درمان: CPR فوری و دفیبریلاسیون زودهنگام.", "هر بیمار دچار ترومای بلانت قفسه سینه و آریتمی یا تغییرات ECG باید مانیتور و پایش شود."], "##تامپوناد و روش‌های تشخیصی", ["سونوگرافی در محل (eFAST) تجمع مایع پریکارد را سریع نشان می‌دهد و در بیمارستان یا در سیستم‌های پیشرفته‌ی پیش‌بیمارستانی کاربرد دارد.", "در ترومای نافذ با ایست قلبی یا قریب‌الوقوع ش function showTab(id,t){
  ["p","l","q"].forEach(k=>document.getElementById("tab-"+k).classList.toggle("on",k===t));
  const body = document.getElementById("tabBody");
  const e = EDU[id];
  if(t==="p"){ renderDetailImages(id,"tabBody"); }
  else if(t==="l"){
    if(e.sections){body.innerHTML=eduSections(e.sections);return;}
    body.innerHTML = `<div class="edu-box"><h3>نکات کلیدی</h3><ul>${e.points.map(p=>`<li>${p}</li>`).join("")}</ul></div>
      <div class="edu-box"><h3>توجه ویژه</h3>${e.special}</div>`;
  } else {
    if(!e.quiz||!e.quiz.length){body.innerHTML='<div class="empty-state">آزمون این پروتکل هنوز اضافه نشده است.</div>';return;}
    quizState = {done:0,score:0};
    body.innerHTML = e.quiz.map((q,i)=>`<div class="q-card"><div class="q-text">${i+1}. ${q.q}</div>
      ${q.o.map((o,j)=>`<button class="opt" id="o-${i}-${j}" onclick="answer('${id}',${i},${j})">${o}</button>`).join("")}
      <div class="why" id="why-${i}"></div></div>`).join("") + `<div class="score" id="score"></div>`;
  }
}

function answer(id,i,j){
  const q = EDU[id].quiz[i];
  if(quizState["a"+i]!==undefined) return;
  quizState["a"+i]=j; quizState.done++;
  if(j===q.a) quizState.score++;
  q.o.forEach((_,k)=>{
    const b=document.getElementById(`o-${i}-${k}`);
    if(k===q.a) b.classList.add("right"); else if(k===j) b.classList.add("wrong");
  });
  document.getElementById("why-"+i).textContent = (j===q.a?"✅ درست! ":"❌ نادرست. ")+q.why;
  if(quizState.done===EDU[id].quiz.length){
    document.getElementById("score").textContent = `نمره‌ی شما: ${quizState.score} از ${EDU[id].quiz.length}`+(TRID.includes(id)?" (در پس‌آزمون ثبت شد)":"");
    try{saveProto(id)}catch(e){}
  }
}

/* آموزش‌های ذخیره‌شده در Supabase: داخل همین برنامه در یک قاب باز می‌شوند و نسخهٔ دریافت‌شده برای استفادهٔ آفلاین نگه داشته می‌شود */
function eduIdb(){return new Promise(function(res,rej){try{const r=indexedDB.open("pa_edu",1);r.onupgradeneeded=function(){r.result.createObjectStore("l");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
async function eduCacheGet(k){try{const d=await eduIdb();return await new Promise(function(res){const q=d.transaction("l").objectStore("l").get(k);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});}catch(e){return null;}}
async function eduCacheSet(k,v){try{const d=await eduIdb();await new Promise(function(res){const t=d.transaction("l","readwrite");t.objectStore("l").put(v,k);t.oncomplete=res;t.onerror=res;t.onabort=res;});}catch(e){}}
function eduClose(){const o=document.getElementById("eduV");if(o)o.remove();document.body.style.overflow="";}

  document.body.appendChild(o);document.body.style.overflow="hidden";
  const M=function(t){const m=document.getElementById("eduM");if(m)m.textContent=t;};
  const ep=(typeof paEP==="function")?paEP():"";
  if(!key){M("برای این آموزش نام فایل ثبت نشده است.");return;}
  let c=await eduCacheGet(key),html=null;
  if(ep&&navigator.onLine){
    try{
      const ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},10000);
      const rv=await fetch(ep+"/lessons/"+key+"/v.json?_="+Date.now(),{cache:"no-store",signal:ctl.signal});clearTimeout(to);
      const v=rv.ok?await rv.json():null;
      if(typeof v==="string"){
        if(c&&c.v===v)html=c.html;
        else{M("در حال دریافت آموزش… (بار اول ممکن است کمی طول بکشد)");
          const r2=await fetch(ep+"/lessons/"+key+"/html.json?_="+Date.now(),{cache:"no-store"});
          const h=r2.ok?await r2.json():null;
          if(typeof h==="string"&&h){html=h;eduCacheSet(key,{v:v,html:h});}}
      }
    }catch(e){}
  }
  if(!html&&c)html=c.html;
  if(!html){M(ep?"این آموزش هنوز منتشر نشده یا اتصال اینترنت برقرار نیست. دوباره تلاش کنید.":"آدرس Supabase در این برنامه تنظیم نشده است.");return;}

  const m=document.getElementById("eduM");if(m)m.replaceWith(f);f.srcdoc=html;}

let CD={deck:[],i:-1,ph:0};
function codeShuffle(){const d=CODES.map((_,i)=>i);for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=d[i];d[i]=d[j];d[j]=x;}
  if(CD.deck.length&&d[0]===CD.deck[CD.deck.length-1]&&d.length>1){const x=d[0];d[0]=d[1];d[1]=x;}CD.deck=d;CD.i=-1;CD.ph=0;}

  if(CD.ph===0){c.innerHTML='<div style="font-size:42px">📻</div><div style="font-size:18px;font-weight:800;margin-top:10px">آزمون کدینگ اورژانس</div><div class="why" style="margin-top:10px">همهٔ '+CODES.length+' کد به‌صورت تصادفی پرسیده می‌شود.<br>برای شروع، صفحه را لمس کنید.</div>';return;}

const NRP_EDU=[{"k": "intro", "t": "چکیده", "h": [["چکیده اجرایی", "<p>این بخش خلاصه‌ای آموزشی و کاربردی از برنامه احیای نوزاد (NRP) بر پایه ویرایش نهم <i>کتاب درسی احیای نوزاد<\/i> آکادمی اطفال آمریکا و راهنمای ۲۰۲۵ مشترک AHA/AAP است. ستون فقرات آن، الگوریتم شش‌بلوکی احیا و آستانه‌های عددی تعیین‌کنندهٔ تصمیم‌گیری بالینی است: از مدیریت بند ناف و سه پرسش ارزیابی اولیه تا تهویه، ماساژ قلبی و اپی‌نفرین. در پایان، جدول‌های مرجع اعداد حیاتی، اصول کار تیمی و پرسش‌های مرور برای تثبیت یادگیری آمده است.<\/p><p>همهٔ اعداد و گام‌های بالینی از <i>کتاب درسی احیای نوزاد<\/i> ویرایش نهم (AAP, 2025) برگرفته و با خلاصهٔ تغییرات علمی ویرایش نهم و صفحهٔ رسمی به‌روزرسانی NRP در AAP تطبیق داده شده است.<\/p>"], ["چرا ویرایش نهم مهم است؟", "<p>ویرایش نهم «کتاب درسی احیای نوزاد» آکادمی اطفال آمریکا در <b>نوامبر ۲۰۲۵<\/b> منتشر شد و محتوای آن با <b>راهنمای ۲۰۲۵ قلب و عروق AHA/AAP<\/b> و اجماع علمی کارگروه احیای نوزاد (ILCOR) هم‌راستا شده است. بر اساس اعلام AAP، مدرسان NRP موظف‌اند <b>پیش از ۱ ژوئن ۲۰۲۶<\/b> از مواد ویرایش نهم استفاده کنند؛ بنابراین فایل‌های آموزشی قدیمی باید کنار گذاشته شوند.<\/p><p>ساختار الگوریتم حفظ شده و همچنان شامل <b>۶ بلوک<\/b> است که با آمادگی تیم آغاز و با مراقبت پس از احیا و دبریفینگ پایان می‌یابد؛ ترتیب منطقی آن از <b>ABCD<\/b> پیروی می‌کند: Airway (راه هوایی)، Breathing (تهویه)، Circulation (گردش خون) و Drug (دارو). آنچه تغییر کرده، بیشتر <b>محتوای درون این بلوک‌ها<\/b> است تا ترتیب آن‌ها.<\/p><p>سه اقدام حیاتی به الگوریتم اضافه یا بازتعریف شده است:<\/p><ul><li><b>«شروع طرح مدیریت بند ناف»<\/b> به‌عنوان نخستین گام پس از تولد<\/li><li>افزایش مدت تأخیر در بستن بند ناف به <b>دست‌کم ۶۰ ثانیه<\/b><\/li><li>آزادسازی کاربرد <b>ماسک حنجره‌ای<\/b> به‌عنوان وسیلهٔ اولیهٔ راه هوایی<\/li><\/ul>"]]}, {"k": "algo", "t": "الگوریتم احیا", "h": [["پیش از تولد", "<p>تیم باید عوامل خطر مادری و جنینی را شناسایی کند، با متخصص زنان درباره برنامهٔ زایمان هم‌فکری کند، در موارد پرخطر با والدین مشاوره و رضایت بگیرد، <b>بریفینگ تیمی<\/b> انجام دهد و تجهیزات را بررسی کند. گام‌های اولیه و ارزیابی باید <b>در محدودهٔ یک دقیقهٔ نخست<\/b> انجام شوند.<\/p>"], ["ارزیابی اولیه", "<p>این ارزیابی در فاصلهٔ تولد تا بستن بند ناف انجام می‌شود و سه پرسش دارد:<\/p><ul><li>آیا نوزاد <b>ترم<\/b> است؟<\/li><li>آیا <b>تون عضلانی خوب<\/b> دارد؟<\/li><li>آیا <b>تنفس یا گریه<\/b> دارد؟<\/li><\/ul><p>اگر پاسخ هر یک منفی بود یا نوزاد <b>پره‌ترم (کمتر از ۳۷ هفته)<\/b> باشد، پس از بستن بند ناف به تخت گرم‌کنندهٔ تشعشعی منتقل می‌شود. نوزاد <b>گاسپینگ<\/b> نیازمند مداخله است.<\/p>"], ["تهویه", "<p>اگر نوزاد آپنه یا گاسپینگ دارد یا ضربان قلب <b>کمتر از ۱۰۰<\/b> است، تهویه با فشار مثبت آغاز می‌شود. اگر در <b>۱۵ تا ۳۰ ثانیهٔ<\/b> نخست ضربان قلب افزایش نیافت و قفسه سینه حرکت نکرد، <b>گام‌های اصلاحی MR SOPA<\/b> اجرا می‌شود: تنظیم ماسک، بازگذاری سر و گردن، ساکشن، باز کردن دهان، افزایش فشار و راه هوایی جایگزین؛ این گام‌ها در ویرایش نهم <b>لزوماً به ترتیب ثابت نیستند<\/b>.<\/p><p>اگر پس از <b>۳۰ ثانیه<\/b> تهویهٔ مؤثر با ماسک صورت، ضربان قلب همچنان <b>کمتر از ۶۰<\/b> بود، راه هوایی جایگزین (لوله‌گذاری یا ماسک حنجره‌ای) گذاشته می‌شود.<\/p>"], ["ماساژ قلبی", "<ul><li>نشانهٔ شروع: ضربان قلب <b>کمتر از ۶۰<\/b> پس از <b>۳۰ ثانیه تهویهٔ کافی<\/b><\/li><li>تکنیک <b>دو شست و احاطهٔ قفسه سینه<\/b>؛ شست‌ها روی <b>یک‌سوم تحتانی و خط میانی جناغ<\/b><\/li><li>عمق فشردن حدود <b>یک‌سوم قطر قدامی–خلفی<\/b> قفسه سینه<\/li><li>نسبت تهویه به ماساژ <b>۳ به ۱<\/b> و سرعت کل <b>۹۰ ماساژ و ۳۰ تنفس در دقیقه<\/b> با <b>اکسیژن ۱۰۰٪<\/b><\/li><li>وقفه‌ها به حداقل برسد<\/li><\/ul>"], ["دارو و مایع", "<ul><li>اپی‌نفرین زمانی تجویز می‌شود که ضربان قلب با وجود تهویهٔ مؤثر و ماساژ هماهنگ همچنان <b>کمتر از ۶۰<\/b> بماند.<\/li><li>غلظت <b>۰٫۱ میلی‌گرم در میلی‌لیتر<\/b>، مسیر <b>وریدی<\/b> از <b>ورید نافی یا سوزن داخل‌استخوانی<\/b><\/li><li>دوز اولیه <b>۰٫۰۲ میلی‌گرم بر کیلوگرم<\/b>، تزریق سریع، سپس <b>۳ میلی‌لیتر نرمال سالین<\/b> و تکرار <b>هر ۳ تا ۵ دقیقه<\/b><\/li><li>در شک به <b>هیپوولمی<\/b>: حجم‌دهی <b>۱۰ میلی‌لیتر بر کیلوگرم<\/b> و در صورت عدم پاسخ، دوز دوم مشابه در <b>۵ تا ۱۰ دقیقه<\/b><\/li><li>در نوزادان <b>زیر ۳۲ هفته<\/b> بولوس سریع خطر خونریزی داخل‌جمجمه‌ای را می‌افزاید.<\/li><li>در کم‌خونی شدید، <b>گلبول قرمز فشرده<\/b> تجویز می‌شود.<\/li><\/ul>"]]}, {"k": "nums", "t": "تغییرات و اعداد", "h": [["تغییرات کلیدی ۲۰۲۵ نسبت به ویرایش هشتم", "<p>بسیاری از خطاهای بالینی از حفظ‌کردن اعداد قدیمی سرچشمه می‌گیرد:<\/p><div class=\"nrp-tw\"><table class=\"nrp-t\"><tr><th>موضوع<\/th><th>توصیهٔ ویرایش نهم (۲۰۲۵)<\/th><th>تغییر<\/th><\/tr><tr><td>مدیریت بند ناف<\/td><td>«شروع طرح مدیریت بند ناف» به‌عنوان گام نخست پس از تولد<\/td><td>افزودهٔ جدید<\/td><\/tr><tr><td>زمان بستن بند ناف<\/td><td>تأخیر <b>حداقل ۶۰ ثانیه<\/b> در بیشتر نوزادان<\/td><td>آستانهٔ بالاتر<\/td><\/tr><tr><td>مکیدن بند ناف (Cord milking)<\/td><td>در ترم/نزدیک‌ترم (<span dir=\"ltr\">۳۵–۴۲<\/span> هفته) بدون قدرت، گزینهٔ معقول؛ در <span dir=\"ltr\">۲۸–۳۴<\/span> هفته شواهد ناکافی؛ در <b>زیر ۲۸ هفته ممنوع<\/b> (خطر IVH شدید)<\/td><td>تعریف دقیق‌تر<\/td><\/tr><tr><td>گام‌های MR SOPA<\/td><td><b>انعطاف‌پذیر و غیرترتیبی<\/b><\/td><td>تغییر از ترتیب ثابت<\/td><\/tr><tr><td>ماسک حنجره‌ای<\/td><td>قابل استفاده به‌عنوان <b>وسیلهٔ اولیه<\/b> راه هوایی<\/td><td>گسترش کاربرد<\/td><\/tr><tr><td>PIP (نوزاد ≥۳۲ هفته)<\/td><td><b>۲۵ سانتی‌متر آب<\/b><\/td><td>افزایش یافته<\/td><\/tr><tr><td>PEEP<\/td><td><b>۵ سانتی‌متر آب<\/b><\/td><td>بدون تغییر<\/td><\/tr><tr><td>سرعت تهویه<\/td><td><b>۳۰ تا ۶۰ تنفس در دقیقه<\/b><\/td><td>بازهٔ به‌روزشده<\/td><\/tr><tr><td>عمق لوله‌گذاری<\/td><td><b>tip-to-gum<\/b> در خط وسط لثهٔ فوقانی (بر پایهٔ سن بارداری/وزن)<\/td><td>جایگزین tip-to-lip<\/td><\/tr><tr><td>FiO₂ آغازین<\/td><td><b>۲۱٪<\/b> برای ≥۳۵ هفته؛ <b>۲۱ تا ۳۰٪<\/b> برای ۳۲ تا ۳۴ هفته؛ <b>≥۳۰٪<\/b> برای زیر ۳۲ هفته<\/td><td>تفکیک گروه‌های بارداری<\/td><\/tr><tr><td>هدف SpO₂<\/td><td>آغاز از <b>دقیقهٔ ۲<\/b> (۶۵ تا ۷۰٪)<\/td><td>جابه‌جایی از دقیقهٔ ۱<\/td><\/tr><\/table><\/div>"], ["جدول هدف اشباع اکسیژن (SpO₂)", "<p>هدف‌گذاری باید با پالس‌اکسیمتری و همراه با پایش مداوم ضربان قلب انجام شود:<\/p><div class=\"nrp-tw\"><table class=\"nrp-t\"><tr><th>زمان پس از تولد<\/th><th>هدف SpO₂<\/th><\/tr><tr><td>۲ دقیقه<\/td><td><b>۶۵٪ تا ۷۰٪<\/b><\/td><\/tr><tr><td>۳ دقیقه<\/td><td><b>۷۰٪ تا ۷۵٪<\/b><\/td><\/tr><tr><td>۴ دقیقه<\/td><td><b>۷۵٪ تا ۸۰٪<\/b><\/td><\/tr><tr><td>۵ دقیقه<\/td><td><b>۸۰٪ تا ۸۵٪<\/b><\/td><\/tr><tr><td>۱۰ دقیقه<\/td><td><b>۸۵٪ تا ۹۵٪<\/b><\/td><\/tr><\/table><\/div>"], ["نکات خطاقریب‌زن", "<ul><li>بستن بند ناف <b>نباید<\/b> آغاز تهویهٔ کمکی را برای نوزادی که در <b>۶۰ ثانیه<\/b> پس از تولد هنوز آپنه است یا ضربان قلبش کمتر از ۱۰۰ است، به تأخیر بیندازد.<\/li><li>حجم‌دهی وریدی محیطی در فروپاشی قلبی–ریوی جایگاه ندارد؛ مسیر انتخابی ورید نافی یا سوزن داخل‌استخوانی است.<\/li><li>اگر با وجود اپی‌نفرین ضربان قلب زیر ۶۰ ماند، به <b>هیپوولمی<\/b> و <b>پنوموتوراکس<\/b> به‌عنوان علل قابل‌برگشت بیندیشید.<\/li><\/ul>"]]}, {"k": "team", "t": "کار تیمی", "h": [["زمان‌بندی تصمیم‌ها", "<p>الگوریتم NRP هر ایستگاه تصمیم را به زمان گره زده است:<\/p><ul><li><b>۱ دقیقه<\/b> برای گام‌های اولیه<\/li><li><b>۱۵ تا ۳۰ ثانیه<\/b> برای بازبینی اثر تهویه<\/li><li><b>۳۰ ثانیه<\/b> تهویهٔ کافی پیش از آغاز ماساژ<\/li><li><b>۳ تا ۵ دقیقه<\/b> برای تکرار اپی‌نفرین<\/li><\/ul>"], ["بریفینگ پیش از زایمان", "<p>بریفینگ جایگاه رسمی در الگوریتم دارد و شامل مرور عوامل خطر، تعیین نقش‌ها، توافق بر آستانه‌های مداخله و بررسی تجهیزات است. تیم باید از پیش بداند چه کسی راه هوایی را مدیریت می‌کند، چه کسی ماساژ می‌دهد، چه کسی دارو می‌دهد و چه کسی زمان‌ها را ثبت می‌کند.<\/p>"], ["دبریفینگ پس از احیا", "<p>دبریفینگ در همهٔ شاخه‌های الگوریتم قرار گرفته و پرسش‌های استاندارد آن این‌هاست:<\/p><ul><li>چه کاری را خوب انجام دادیم؟<\/li><li>چه چیزی را می‌توانستیم بهتر انجام دهیم؟<\/li><li>آیا همهٔ اطلاعات لازم را داشتیم؟<\/li><li>آیا افراد و تجهیزات درست در دسترس بودند؟<\/li><li>چه مواردی نیازمند پیگیری است؟<\/li><\/ul><p>دبریفینگ اثربخش لزوماً نیازی به یافتن مشکل بزرگ ندارد.<\/p>"], ["شاخص‌های قابل‌سنجش تیمی", "<ul><li>درصد نوزادان سالم با تأخیر بستن بند ناف <b>دست‌کم ۶۰ ثانیه<\/b><\/li><li>ثبت دقیق زمان‌بندی رویدادها<\/li><li>دفعات برگزاری شبیه‌ساز     (wrong.length?'<details class="bx"><summary>سؤالات اشتباه ('+fa(wrong.length)+')</summary>'+wrong.map(function(x){return '<div style="margin-top:8px">• '+x.q+'<br><b>پاسخ صحیح:</b> '+x.right+'<br><span style="opacity:.85">'+x.why+'</span></div>';}).join('')+'</details>':'<div class="bx">عالی! همهٔ پاسخ‌ها درست بود 🎉</div>')+
    '<button class="btn sec" onclick="startNrp(\''+kind+'\')">انجام مجدد</button><button class="btn sec" onclick="goNrpExam()">بازگشت به آزمون NRP</button>');
  try{paPost();}catch(e){}
}
const nq=window.nextQ;
window.nextQ=function(){if((EXMODE==="nrp-pre"||EXMODE==="nrp-post")&&qi+1>=QS.length){finishNrp(EXMODE.slice(4));return;}return nq.apply(this,arguments);};
/* کارت «آزمون NRP» در فهرست آزمون‌ها */
const gq=window.goQuiz;
window.goQuiz=function(){const r=gq.apply(this,arguments);try{const h=document.querySelector("#mainContent .hub");
  if(h&&!h.querySelector("[data-nrpx]")){const d=nLoad();
  h.insertAdjacentHTML("beforeend",'<div class="hub-card" data-nrpx="1" onclick="goNrpExam()"><div class="hub-ic">👶</div><div class="hub-t">آزمون NRP</div><div class="hub-d">پیش‌آزمون: '+(d.pre?fa(d.pre.pct):"—")+' · پس‌آزمون: '+(d.post?fa(d.post.pct):"—")+'</div></div>');}}catch(x){}return r;};
/* ارسال نتیجه به پنل ادمین همراه سایر نتایج */
const pp3=window.paPayload;
window.paPayload=function(){const p=pp3.apply(this,arguments);try{const t=nLoad();if(Object.keys(t).length)p.nrp=t;}catch(e){}return p;};
})();
</script>
<script>
/* ورود یک‌بارهٔ دانشجو: کد ورود هنگام باز کردن آموزش‌ها همراه لینک می‌رود تا دوباره رمز نخواهند */
window.paHand=function(u){try{const c=localStorage.getItem("pa_code"),d=localStorage.getItem("pa_dev");
  if(c&&d&&/^[A-Z0-9]{12}$/.test(c)&&/^[A-Za-z0-9]{6,40}$/.test(d)&&String(u).indexOf(".github.io/")>0)return String(u).split("#")[0]+"#pa="+c+"."+d+"."+Date.now().toString(36);}catch(e){}return u;};
/* لینک کارت‌ها ساده می‌ماند (کپی لینک کد ندارد)؛ کد فقط لحظهٔ کلیک و برای دو دقیقه همراه می‌رود */
document.addEventListener("click",function(e){try{const a=e.target&&e.target.closest?e.target.closest("a[href]"):null;
  if(a&&/\.github\.io\/Ems-edu\//.test(a.href)&&a.href.indexOf("student-panel")<0){const plain=a.href.split("#")[0];a.href=window.paHand(plain);setTimeout(function(){a.href=plain;},1500);}}catch(x){}},true);
/* بازگشت از صفحه‌های آموزش (GitHub) مستقیم به بخش آموزش */
(function(){function tryEdu(){try{if(location.hash==="#edu"&&typeof goEdu==="function"&&typeof currentView!=="undefined"&&currentView&&currentView.name!=="edu"){goEdu();}}catch(e){}}
window.addEventListener("load",function(){tryEdu();setTimeout(tryEdu,700);setTimeout(tryEdu,2500);});})();
</script>
