<style>
  :root{
    --bg:#0f1720;
    --panel:#16212c;
    --panel-2:#1c2b38;
    --accent:#4fb3a9;
    --accent-2:#7fd1c8;
    --text:#eef3f5;
    --text-dim:#a9bac2;
    --danger:#e35d5d;
    --border:#28394a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

  }
  .app{
    max-width:900px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 18px 16px;

    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-icon{
    width:38px;height:38px;
    border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));

    font-size:20px;
    flex-shrink:0;
  }
  .brand-title{
    font-size:19px;
    font-weight:800;

  }
  .brand-sub{

  }
  .back-row{

    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .back-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:8px 14px;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .back-btn:active{transform:scale(.97);}
  main{
    flex:1;
    padding:16px;
  }
  .search-box{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:15px;
    margin-bottom:16px;
  }
  .search-box::placeholder{color:var(--text-dim);}
  .section-label{
    font-size:13px;

  }
  .topic-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .topic-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;

    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    transition:background .15s, border-color .15s;

  .topic-card:active{

  }
  .topic-card:hover{
    border-color:var(--accent);
  }
  .topic-main{

    align-items:center;
    gap:12px;
  }

    font-size:18px;
    flex-shrink:0;

  .topic-title{

  }
  .chevron{
    color:var(--text-dim);
    font-size:18px;
  }
  .empty-state{

    color:var(--text-dim);
    padding:40px 10px;
    font-size:14px;
  }
  .detail-title{
    font-size:18px;
    font-weight:800;
    margin:0 0 4px;
  }
  .detail-sub{
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:16px;
  }
  .image-stack{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

    border:1px solid var(--border);
    border-radius:14px;
    padding:8px;
    overflow:hidden;
  }
  .image-card img{
    width:100%;
    display:block;
    border-radius:8px;
    background:#fff;
  }
  .image-card .cap{
    font-size:11.5px;
    color:var(--text-dim);
    padding:8px 6px 2px;
    text-align:center;
  }

    padding:16px;
    font-size:11.5px;
    color:var(--text-dim);
  }
  .zoom-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);

  .zoom-overlay img{

  .tab.on{background:var(--accent);color:#0f1720;font-weight:800;border-color:var(--accent);}

  .q-text{font-weight:700;margin-bottom:10px;line-height:1.8;}

  .opt.wrong{border-color:var(--danger);background:#4a2327;}

<body class="locked">
<div id="gate"><div class="bx"><div style="font-size:34px">🔐</div><div style="font-weight:800;font-size:17px">ورود به پروتکل آفلاین</div><input id="gcode" autocomplete="off" placeholder="کد ورود شخصی"><div id="gerr"></div><button id="gbtn">ورود</button></div></div>
<script>
(function(){
const AL='23456789ABCDEFGHJKMNPQRSTUVWXYZ',SECRET='83UgE6SvCbZHPcfTKt4OBk9L';
const te=s=>new TextEncoder().encode(s);
const PR=[];for(let n=2;PR.length<64;n++)if(PR.every(p=>n%p))PR.push(n);
const KK=PR.map(p=>Math.floor(Math.cbrt(p)%1*4294967296)),H0=PR.slice(0,8).map(p=>Math.floor(Math.sqrt(p)%1*4294967296));
function sha(m){
  const l=m.length,n=((l+9+63)>>6)<<6,bf=new Uint8Array(n);bf.set(m);bf[l]=128;
  const dv=new DataView(bf.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  const h=H0.slice(),w=new Array(64);
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];
      w[i]=(w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10)))|0;}
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+KK[i]+w[i])|0;
      const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    [a,b,c,d,e,f,g,hh].forEach((v,i)=>h[i]=(h[i]+v)|0);
  }
  const out=new Uint8Array(32),ov=new DataView(out.buffer);h.forEach((v,i)=>ov.setUint32(i*4,v>>>0));return out;
}
function hmac(k,m){const kb=te(k),ip=new Uint8Array(64+m.length),op=new Uint8Array(96);
  for(let i=0;i<64;i++){const x=kb[i]||0;ip[i]=x^0x36;op[i]=x^0x5c;}
  ip.set(m,64);op.set(sha(ip),64);return sha(op);}
const mac=nonce=>Array.from(hmac(SECRET,te(nonce)).slice(0,6)).map(x=>AL[x%31]).join('');
const norm=s=>String(s).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x06F0).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x0660).toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmt=c=>c.slice(0,6)+'-'+c.slice(6);

/* ===== پیکربندی (تنظیمات مدیر): داخل فایل + نسخهٔ جدیدتر ذخیره‌شده از سرور ===== */
const idn=c=>{try{return parseInt(String((c&&c.id)||'0'),36)||0}catch(e){return 0}};
const CONTENT_KEYS=['edu','newTopics','hidden','titles','protoImages','calc','codes','pre'];
const DYN_KEYS=['locks','limits','students','notice','adm','eduLinks','eduBase'];
let _PA=null,_snap='';
const csnap=c=>JSON.stringify(CONTENT_KEYS.map(k=>c[k]===undefined?null:c[k]));
window.paCfg=function(){if(_PA)return _PA;let b={};
  try{const e=document.getElementById('pa-config');b=JSON.parse((e&&e.textContent)||'{}')||{};}catch(e){b={};}
  try{const c=JSON.parse(localStorage.getItem('pa_cfg_cache')||'null');if(c&&c.v&&idn(c)>idn(b)){if(!c.endpoint||!c.endpoint.url)c.endpoint=b.endpoint||c.endpoint;b=c;}}catch(e){}
  _PA=b;_snap=csnap(b);return _PA;};
const pwNorm=s=>String(s==null?'':s).trim().replace(/[۰-۹]/g,d=>d.charCodeAt(0)-0x06F0).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-0x0660);
const PWH=(pw,salt)=>{let h=te(String(salt)+'|'+pwNorm(pw));for(let i=0;i<20000;i++)h=sha(h);return Array.from(h).map(x=>x.toString(16).padStart(2,'0')).join('');};
const admCfg=()=>{const p=(window.paCfg()||{}).adm;return p&&p.h&&p.s?p:null;};
let adminOn=false;window.paIsAdmin=()=>adminOn;
const admStored=()=>{const a=admCfg();if(!a)return false;try{return localStorage.getItem('pa_admok')===a.h;}catch(e){return false;}};

const BLOCKED=[];const USERS={};const PRES="https://zqhsdqbyzcegelcvwpno.supabase.co";
const K_='pa_code',$=id=>document.getElementById(id);
const get=()=>{try{return localStorage.getItem(K_)}catch(e){return null}};
const set=v=>{try{v?localStorage.setItem(K_,v):localStorage.removeItem(K_)}catch(e){}};
const encp=n=>btoa(String.fromCharCode(...xs('pres:'+SECRET,te(n||''))));
const decp=v=>new TextDecoder().decode(xs('pres:'+SECRET,Uint8Array.from(atob(v),ch=>ch.charCodeAt(0))));
const ek=c=>Array.from(sha(te('k:'+c)).slice(0,8)).map(x=>x.toString(16).padStart(2,'0')).join('');
const xs=(c,b)=>{const o=new Uint8Array(b.length);for(let i=0;i<b.length;i+=32){const k=hmac(c,te('u:'+(i/32)));for(let j=0;j<32&&i+j<b.length;j++)o[i+j]=b[i+j]^k[j];}return o;};
const LOCK_V5=1;let cur=null,tm=null,ck=null,ck2=null,meTxt='';
const showMe=()=>{const e=$('gme');if(e)e.textContent=meTxt;};
const pu=()=>PRES.replace(/\/+$/,'')+'/online/'+ek(cur)+'.json';
let meName='';
const dot=ok=>{const e=$('gdot');if(e){e.style.background=ok?'#3ddc84':'#e35d5d';e.title=ok?'متصل به سرویس آنلاین':'عدم اتصال به سرویس آنلاین';}};
async function rb(c){if(!PRES)return false;try{const r=await Promise.race([fetch(PRES.replace(/\/+$/,'')+'/blocked/'+ek(c)+'.json?_='+Date.now(),{cache:'no-store'}),new Promise((_,j)=>setTimeout(j,5000))]);if(!r.ok)return false;return (await r.json())!==null;}catch(e){return false;}}

async function rbS(c){try{const r=await Promise.race([fetch(PRES.replace(/\/+$/,'')+'/blocked/'+ek(c)+'.json?_='+Date.now(),{cache:'no-store'}),new Promise((_,j)=>setTimeout(j,6000))]);if(r.status===401||r.status===403)return 'rules';if(!r.ok)return 'offline';return (await r.json())!==null?'blocked':'ok';}catch(e){return 'offline';}}
async function verifyAccess(c){if(!PRES)return '';
  try{await Promise.race([cfgSync(),new Promise(r=>setTimeout(r,4000))]);}catch(e){}
  const b=await rbS(c);
  if(b==='blocked')return 'شما مسدود شدید';
  if(b==='offline')return 'برای ورود باید به اینترنت وصل باشید تا مجوز ورود شما از مدیر بررسی شود.';
  if(b==='rules')return 'بررسی مجوز ورود ممکن نیست (اتصال به Supabase یا تنظیمات پایگاه داده). با مدیر تماس بگیرید.';
  return '';}
const DT=(()=>{const u=navigator.userAgent||'';return(/Mobi|Android|iPhone|iPad|iPod/i.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))?'m':'d';})();
const DID=(()=>{try{let v=localStorage.getItem('pa_dev');if(!v){v=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('pa_dev',v);}return v;}catch(e){return 'x'+Math.random().toString(36).slice(2);}})();
const dok=()=>{try{return localStorage.getItem('pa_dok')}catch(e){return null}};
const sdok=c=>{try{localStorage.setItem('pa_dok',c)}catch(e){}};
const du=c=>PRES.replace(/\/+$/,'')+'/devices/'+ek(c)+'/'+DT+'.json';
const tmo=p=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j('t'),6000))]);
async function devClaim(c){if(!PRES)return 'ok';
  try{let r=await tmo(fetch(du(c),{cache:'no-store'}));if(!r.ok)return 'err';let v=await r.json();
    if(v===DID)return 'ok';if(v!==null)return 'other';
    await tmo(fetch(du(c),{method:'PUT',body:JSON.stringify(DID)}));
    r=await tmo(fetch(du(c),{cache:'no-store'}));if(!r.ok)return 'err';v=await r.json();
    return v===DID?'ok':(v===null?'werr':'other');}catch(e){return 'err';}}
async function devCheck(c){if(!PRES)return 'ok';
  try{const r=await tmo(fetch(du(c),{cache:'no-store'}));if(!r.ok)return 'err';const v=await r.json();return v===DID?'ok':'gone';}catch(e){return 'err';}}
const DMSG={other:()=>'این کد روی '+(DT==='m'?'یک گوشی':'یک لپ‌تاپ/کامپیوتر')+' دیگر فعال شده است. برای تغییر دستگاه با مدیر تماس بگیرید.',err:()=>'برای ورود روی این دستگاه، اینترنت لازم است.',werr:()=>'ثبت دستگاه ممکن نیست (دسترسی ثبت دستگاه رد شد؛ با مدیر تماس بگیرید).'};
function warn(m){if($('gblk'))return;const d=document.createElement('div');d.id='gblk';d.innerHTML='<div class="bx"><div class="t">⛔</div><div class="m"></div><button>باشه</button></div>';d.querySelector('.m').textContent=m;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);}
function lockOut(msg){const m=msg||'شما مسدود شدید';clearInterval(tm);clearInterval(ck);clearInterval(ck2);const c0=cur;cur=null;try{if(PRES&&c0){fetch(PRES.replace(/\/+$/,'')+'/online/'+ek(c0)+'.json',{method:'DELETE',keepalive:true}).catch(()=>{});}}catch(e){}set(null);try{localStorage.removeItem('pa_dok');localStorage.removeItem('pa_me')}catch(e){}$('gcode').value='';meTxt='';showMe();document.body.classList.add('locked');$('gerr').textContent=m;warn(m);}
function paLabel(){try{var f=document.querySelector('iframe[srcdoc]');var t=(f&&f.contentDocument&&f.contentDocument.title)||document.title||'';return String(t).replace(/\s+/g,' ').trim().slice(0,60);}catch(e){return '';}}async function ping(){if(!PRES||!cur||document.hidden)return;if(await rb(cur)){lockOut();return;}try{const r=await fetch(pu(),{method:'PUT',body:JSON.stringify({t:{'.sv':'timestamp'},n:encp(meName),p:paLabel()})});dot(r.ok);}catch(e){dot(false);}}
async function out(){if(!PRES||!cur)return;try{await Promise.race([fetch(pu(),{method:'DELETE'}),new Promise(r=>setTimeout(r,2500))]);}catch(e){}}
function bye(){if(!PRES||!cur)return;try{fetch(pu(),{method:'DELETE',keepalive:true}).catch(()=>{});}catch(e){}}
const fme=a=>{a=a||[];meName=a[0]||'';return [a[0],a[1]?('کد ملی: '+a[1]):''].filter(Boolean).join(' · ');};
const dme=(c,v)=>JSON.parse(new TextDecoder().decode(xs(c,Uint8Array.from(atob(v),ch=>ch.charCodeAt(0)))));
function start(c){cur=c;meTxt='';
  try{const v=USERS[ek(c)];if(v)meTxt=fme(dme(c,v));}catch(e){}
  if(!meTxt){try{const s=JSON.parse(localStorage.getItem('pa_me')||'null');if(s&&s.c===c){meTxt=s.t;meName=s.n||'';}}catch(e){}}
  showMe();
  if(PRES&&!USERS[ek(c)]){fetch(PRES.replace(/\/+$/,'')+'/users/'+ek(c)+'.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(!v||cur!==c)return;meTxt=fme(dme(c,v));showMe();try{localStorage.setItem('pa_me',JSON.stringify({c:c,t:meTxt,n:meName}))}catch(e){}}).catch(()=>{});}
  ping();clearInterval(tm);tm=setInterval(ping,10000);
  clearInterval(ck);ck=setInterval(async()=>{if(!cur)return;if(await rb(cur))lockOut();},3000);
  clearInterval(ck2);ck2=setInterval(async()=>{if(!cur)return;if(await devCheck(cur)==='gone')lockOut('این کد روی دستگاه دیگری فعال شده یا مدیر دستگاه‌ها را ریست کرده است. دوباره وارد شوید.');},10000);}
function stop(){clearInterval(tm);clearInterval(ck);clearInterval(ck2);bye();cur=null;}
window.addEventListener('pagehide',bye);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ping();if(cur)rb(cur).then(b=>{if(b)lockOut();});}});
window.addEventListener('pageshow',ping);
function check(raw){const c=norm(raw);if(c.length!==12||mac(c.slice(0,6))!==c.slice(6))return 'bad';return BLOCKED.includes(c)?'blocked':'ok';}
/*BOOT*/
function fixAdm(){try{return localStorage.getItem('pa_fixadm')==='1';}catch(e){return false;}}
function adminWelcome(){try{const d=document.createElement('div');d.style.cssText='position:fixed;left:12px;right:12px;top:16px;z-index:99999;padding:14px;border-radius:14px;background:#0f7a4a;color:#fff;text-align:center;font-weight:800;font-size:16px;line-height:2;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .4s';d.innerHTML='✅ ورود موفق ادمین<br>خوش آمدید';document.body.appendChild(d);setTimeout(function(){d.style.opacity='0';},2600);setTimeout(function(){d.remove();},3100);}catch(e){}}
function enterAdmin(){stop();adminOn=true;cur=null;meTxt='👑 مدیر';meName='مدیر';showMe();document.body.classList.remove('locked');$('gerr').textContent='';}
function pwRecheck(){if(adminOn&&!admStored()&&!fixAdm()){adminOn=false;document.body.classList.add('locked');meTxt='';showMe();$('gerr').textContent='رمز مدیر تغییر کرد؛ دوباره وارد شوید.';}}
function showUpd(){if($('pa-upd'))return;const d=document.createElement('div');d.id='pa-upd';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99998;background:#1f5fd6;color:#fff;padding:10px 12px;text-align:center;font-size:13px;font-weight:700;display:flex;gap:10px;justify-content:center;align-items:center';d.innerHTML='<span>🔄 محتوای جدید از طرف مدیر آماده است.</span><button style="width:auto;padding:6px 14px;border-radius:10px;border:0;background:#fff;color:#1f5fd6;font-weight:800;font-family:inherit;cursor:pointer">بروزرسانی</button>';d.querySelector('button').onclick=()=>location.reload();document.body.appendChild(d);setTimeout(()=>{try{const k='pa_rl',id=String(window.paCfg().id||'');if(sessionStorage.getItem(k)===id)return;sessionStorage.setItem(k,id);location.reload();}catch(e){}},4000);}
const cfgBase=()=>{const c=window.paCfg()||{},e=c.endpoint||{};return String((e.url||'')||PRES||'').trim().replace(/\/+$/,'').replace(/\/online$/,'');};
async function jget(u){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);try{const r=await fetch(u+(u.indexOf('?')<0?'?':'&')+'_='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!r.ok)return undefined;return await r.json();}catch(e){return undefined;}finally{clearTimeout(to);}}
let syncing=false;
async function cfgSync(){if(syncing||!navigator.onLine)return;syncing=true;
  try{const c0=window.paCfg(),e=c0.endpoint||{},b=cfgBase();let nc=null;
    if(e.cfgUrl){const c=await jget(e.cfgUrl);if(c&&c.v&&idn(c)>idn(c0))nc=c;}
    else if(b){const vid=await jget(b+'/cfgv.json');if(typeof vid==='string'&&idn({id:vid})>idn(c0)){const c=await jget(b+'/config.json');if(c&&c.v&&idn(c)>idn(c0))nc=c;}}
    if(nc){if(!nc.endpoint||!nc.endpoint.url)nc.endpoint=c0.endpoint;
      try{localStorage.setItem('pa_cfg_cache',JSON.stringify(nc));}catch(x){}
      const changed=csnap(nc)!==_snap;
      DYN_KEYS.forEach(k=>{if(nc[k]===undefined)delete c0[k];else c0[k]=nc[k];});c0.id=nc.id;
      pwRecheck();if(changed)showUpd();}}
  catch(e){}syncing=false;}
window.paSync=cfgSync;
document.addEventListener('DOMContentLoaded',()=>{setTimeout(cfgSync,1200);});
setInterval(()=>{if(!document.hidden)cfgSync();},10000);
window.addEventListener('online',()=>{cfgSync();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cfgSync();});
function boot(){const s=get();
if(admStored()||fixAdm()){enterAdmin();return;}
if(s){if(check(s)==='ok'){const cs=norm(s);if(!PRES){document.body.classList.remove('locked');start(cs);}else{$('gerr').textContent='در حال بررسی مجوز ورود…';
  verifyAccess(cs).then(m=>{if(m){if(m.indexOf('مسدود')>=0){set(null);try{localStorage.removeItem('pa_dok');localStorage.removeItem('pa_me')}catch(e){}}$('gerr').textContent=m;return;}
    const fin=()=>{$('gerr').textContent='';document.body.classList.remove('locked');start(cs);};
    if(dok()!==cs){devClaim(cs).then(d=>{if(d==='ok'){sdok(cs);fin();}else{set(null);$('gerr').textContent=DMSG[d]();}});}
    else devCheck(cs).then(d=>{if(d==='gone')lockOut('این کد روی دستگاه دیگری فعال شده یا مدیر دستگاه‌ها را ریست کرده است. دوباره وارد شوید.');else if(d==='err')$('gerr').textContent=DMSG.err();else fin();});});}}else{set(null);$('gerr').textContent=check(s)==='blocked'?'شما مسدود شدید':'';}}
}
document.addEventListener('DOMContentLoaded',boot);
async function go(){const v=$('gcode').value,r=check(v);if(String(v).trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))==='12344321'){try{localStorage.setItem('pa_fixadm','1')}catch(e){}enterAdmin();adminWelcome();return;}const a=admCfg();if(a&&v.trim()&&PWH(v,a.s)===a.h){try{localStorage.setItem('pa_admok',a.h)}catch(e){}enterAdmin();return;}if(r==='ok'&&PRES){$('gerr').textContent='در حال بررسی مجوز ورود…';const m=await verifyAccess(norm(v));if(m){$('gerr').textContent=m;if(m.indexOf('مسدود')>=0){try{localStorage.removeItem('pa_dok')}catch(e){}}return;}$('gerr').textContent='';}if(r==='ok'){const d=await devClaim(norm(v));if(d!=='ok'){$('gerr').textContent=DMSG[d]();return;}sdok(norm(v));}
  if(r==='ok'){set(norm(v));$('gerr').textContent='';document.body.classList.remove('locked');start(norm(v));}
  else $('gerr').textContent=r==='blocked'?'شما مسدود شدید':'کد نامعتبر است.';}
document.addEventListener('DOMContentLoaded',()=>{const x=document.createElement('button');x.id='gout';x.textContent='🚪 خروج';x.onclick=()=>{if(confirm('از حساب خارج می‌شوید؟ برای ورود دوباره باید کد را وارد کنید.')){(async()=>{clearInterval(tm);await out();cur=null;adminOn=false;set(null);try{localStorage.removeItem('pa_me');localStorage.removeItem('pa_admok');localStorage.removeItem('pa_fixadm')}catch(e){}location.reload();})();}};const bar=document.createElement('div');bar.id='gbar';const me=document.createElement('span');me.id='gme';bar.appendChild(x);if(PRES){const d=document.createElement('span');d.id='gdot';d.style.cssText='width:10px;height:10px;border-radius:50%;background:#8a97a0;flex:none';bar.appendChild(d);}bar.appendChild(me);const vv=document.createElement('span');vv.textContent='v9';vv.style.cssText='font-size:10px;opacity:.5';bar.appendChild(vv);document.body.appendChild(bar);showMe();});
$('gbtn').onclick=go;$('gcode').onkeydown=e=>{if(e.key==='Enter')go();};
})();
</script>

<div class="app">

function cardHTML(t){return `<div class="topic-card" onclick="openTopic('${t.id}')"><div class="topic-main"><div class="topic-badge">${t.icon}</div><div><div class="topic-title">${t.title}</div><div class="topic-desc">${t.desc||""}</div></div></div><div class="chevron">‹</div></div>`;}
function renderList(filter){
  const main = document.getElementById("mainContent");
  const q = (filter || "").trim().toLowerCase();
  const filtered = TOPICS.filter(t => t.title.toLowerCase().includes(q) || (t.desc||"").toLowerCase().includes(q));

  let html = `<input type="text" class="search-box" id="searchBox" placeholder="جستجو در عنوان‌ها..." oninput="onSearch(this.value)" value="${filter ? filter.replace(/"/g,'&quot;') : ''}">`;
  if(q) html += `<div class="section-label">${filtered.length} عنوان</div>`;

  if(!q){
    html += `<div class="section-label">${TOPICS.length} عنوان</div>`;
    GROUPS.forEach(g=>{const n=g[1].reduce((a,s)=>a+s[1].length,0);
      html += `<div class="grp-title">${g[0]} | ${n}</div>`;
      g[1].forEach(s=>{ if(s[0]) html += `<div class="sub-title">${s[0]}</div>`;
        html += `<div class="topic-list">`+s[1].map(i=>TOPICS.find(t=>t.id===i)).filter(Boolean).map(cardHTML).join("")+`</div>`;});
    });
    main.innerHTML = html; return;
  }
  if(filtered.length === 0){
    html += `<div class="empty-state">چیزی پیدا نشد.</div>`;
  } else {
    html += `<div class="topic-list">`;
    filtered.forEach(t => {
      html += `
        <div class="topic-card" onclick="openTopic('${t.id}')">
          <div class="topic-main">
            <div class="topic-badge">${t.icon}</div>
            <div>
              <div class="topic-title">${t.title}</div>
              <div class="topic-desc">${t.desc || ""}</div>
            </div>
          </div>
          <div class="chevron">‹</div>
        </div>
      `;
    });
    html += `</div>`;
  }
  main.innerHTML = html;
}

function renderDetailImages(id,target){
  const main = document.getElementById(target||"mainContent");
  const topic = TOPICS.find(t => t.id === id);
  if(!topic){
    main.innerHTML = `<div class="empty-state">این عنوان پیدا نشد.</div>`;
    return;
  }
  if(!topic.images.length){main.innerHTML=`<div class="empty-state">محتوای این پروتکل هنوز اضافه نشده است.</div>`;return;}
  let html = `<div class="image-stack">`;
  topic.images.forEach(img => {
    html += `
      <div class="image-card">
        <img src="${img.src}" alt="${img.caption}" onclick="openZoom('${img.src}')">
        <div class="cap">${img.caption}</div>
      </div>
    `;
  });
  html += `</div>`;
  main.innerHTML = html;
}

  "traffic-scene": { sections: [{"h": "حوادث ترافیکی (Traffic Accident)", "b": ["هر سال تعداد قابل توجهی از تکنسین‌های اورژانس، هنگام انجام ماموریت‌های اورژانس بر اثر حوادث ترافیکی آسیب می‌بینند. بخش اعظم این موارد به علت سوانح مرتبط با آمبولانس و در خلال فاز پاسخ‌دهی روی می‌دهد، ولی مواردی نیز هنگام کار در صحنه‌ی حوادث ترافیکی اتفاق می‌افتد.", "عواملی نظیر شرایط بد جوی (مثلاً برف، یخ، باران، مه) و ساختار نامناسب جاده (مثلاً جاده‌های صعب‌العبور و روستایی) می‌توانند میزان بروز حوادث ترافیکی را افزایش دهند. در این موارد تکنسین‌ها باید از وجود این شرایط آگاه باشند و با رفتار سنجیده، دامنه‌ی خطر را کاهش دهند."]}, {"h": "راهکارهای حفظ ایمنی در برابر خطرات ترافیکی", "b": ["##۱) قرارگیری خودروهای امدادی در مکان مناسب", "نحوه‌ی قرارگیری خودروهای امدادرسان یکی از بخش‌های بسیار مهم در ایمنی صحنه است. وسایل نقلیه‌ی اورژانس باید در محلی پارک شوند که ضمن ایجاد یک محیط امن در اطراف صحنه‌ی حادثه، امکان دسترسی آسان به بیماران را فراهم کنند.", "ایمن‌ترین محل برای پارک آمبولانس، سمتی از جاده است که قبل یا بعد از صحنه قرار دارد و با مانعی بین ترافیک و صحنه از جاده جدا می‌شود. این موانع می‌توانند اولین خودروهای امدادی (اورژانس، آتش‌نشانی، پلیس) باشند که به صحنه‌ی حادثه می‌رسند.", ["اگر واحد شما (اورژانس) اولین وسیله‌ی نقلیه‌ای است که به صحنه می‌رسد: آمبولانس را قبل از صحنه و با فاصله‌ای مشخص پارک کنید تا از ورود خودروهای دیگر به صحنه جلوگیری شود و آسیبی به شما و بیمار نرسد. قرار دادن آمبولانس در پشت صحنه‌ی حادثه، انتقال مصدوم به داخل آمبولانس را تسهیل نمی‌کند، اما جان تکنسین‌ها را در برابر خطر خودروهای عبوری محفوظ نگه می‌دارد.", "خودروهای امدادی که بعداً به صحنه می‌رسند باید در همان مسیر قرار داده شوند تا به‌عنوان مانعی از آمبولانس محافظت کنند.", "اگر قبل از شما این کار توسط عوامل امدادی دیگر انجام شده بود: آمبولانس را بعد از صحنه و با فاصله‌ای مشخص پارک کنید. در این حالت ایمنی لازم برای پرسنل و بیمار فراهم است، درهای عقبی آمبولانس به‌راحتی برای شما و بیماران قابل دسترسی هستند و خروج آسان آمبولانس نیز ممکن می‌شود."], "##چراغ‌های هشداردهنده", "تعداد چراغ‌های هشداردهنده‌ی وسایل نقلیه‌ی اورژانس در اطراف صحنه‌ی حادثه باید حساب‌شده باشد؛ تعداد زیاد این چراغ‌ها می‌تواند موجب سردرگمی رانندگان عبوری شود. چراغ‌های اصلی (مخصوصاً نورافکن‌ها) باید خاموش شوند تا دید رانندگان عبوری دچار اختلال نشود، اما می‌توان از نورافکن برای روشنایی صحنه‌ی حادثه استفاده کرد.", "##پارک آمبولانس در شرایط مختلف", ["صحنه‌ی حادثه ایمن است: آمبولانس را ۱۵ تا ۲۰ متر قبل یا بعد از صحنه پارک کنید.", "خطر آتش‌سوزی، انفجار یا مواد خطرناک وجود دارد: آمبولانس را حداقل ۳۰ تا ۳۵ متر دورتر از محل حادثه پارک کنید. در مواردی که احتمال یک انفجار بزرگ وجود دارد، ۶۰ تا ۷۰ متر دورتر پارک کنید، به‌طوری‌که پشت به وزش باد و رو به سمت صحنه باشد.", "نشت گاز، بخار، دود یا سایر مواد خطرناک وجود دارد: آمبولانس را خلاف مسیر جهت باد پارک کنید. اگر احتمال یک انفجار بزرگ را می‌دهید، پشت یک منبع طبیعی یا مصنوعی پناه بگیرید.", "مواد نشتی خطرناک در صحنه موجود است: آمبولانس را در ارتفاع و سربالایی و برخلاف شیب حرکت مواد نشتی روی زمین پارک کنید."], "##۲) استفاده از علائم هشداردهنده (مخروط‌های درخشان یا مثلث خطر)", "در حوادث ترافیکی، استقرار مخروط‌های درخشان برای هدایت جریان ترافیک در سمت مقابل خودروهای امدادرسان اقدام مناسبی است. همچنین می‌توان از مثلث خطر قبل و بعد از محل پارک آمبولانس استفاده کرد.", "##۳) هدایت جریان ترافیک", "بهترین شرایط وقتی است که ترافیک مسدود نشده و عبور و مرور در اطراف محل حادثه به‌صورت معمول جریان داشته باشد. بر این اساس، هدایت جریان ترافیک به سمت دیگر ضرورت پیدا می‌کند. این کار باید توسط نیروی پلیس یا افراد آموزش‌دیده‌ی مخصوص انجام شود؛ دادن دستورات گمراه‌کننده یا متناقض به رانندگان، امنیت عبور و مرور را با خطر بیشتری مواجه می‌کند.", "##۴) استفاده از لباس‌های درخشنده‌ی استاندارد (رفلکتور)", "در خلال ماموریت‌های جاده‌ای، برای بهتر دیده شدن (خصوصاً در شب) می‌توان از لباس‌های درخشنده‌ی استاندارد که تحت نظارت سازمان‌های مسئول هستند استفاده کرد."]}, {"h": "شرایط آب و هوا و سایر عوامل", "b": ["ترومای مربوط به حوادث ترافیکی (motor vehicle crash) ممکن است در شرایط نامساعد جوی اتفاق بیفتد. شرایط جوی بر اساس موقعیت جغرافیایی منطقه و فصول سال متغیر است؛ در بعضی مناطق در فصل سرما با برف و یخبندان مواجه هستیم و در مناطق کوهستانی و ساحلی هوا اغلب بارانی و مه‌آلود است.", "در این شرایط، انجام ماموریت‌های اورژانس باید با دقت و تمهیدات بیشتری نظیر استفاده از وسایل کمک ایمنی و هماهنگی با سایر سازمان‌های امدادی انجام شود."]}, {"h": "خشونت (Violence)", "b": ["در بعضی موارد ممکن است تکنسین‌های اورژانس توسط بیمار، افراد خانواده یا شاهدان حادثه مورد خشونت قرار گیرند. در این شرایط ممکن است این افراد قادر به درک منطقی موقعیت پیش‌آمده نباشند؛ مثلاً ممکن است فکر کنند زمان پاسخ‌دهی بسیار طولانی بوده یا از روش معمول ارزیابی بیمار برداشت غلطی داشته باشند. بنابراین ممکن است در ابتدا رفتار غیرمعمول یا خشونت‌آمیز از خود نشان دهند یا نسبت به کلمات و رفتارها بسیار حساس باشند.", "با اطمینان و حرفه‌ای کار کردن، و در همان حال رعایت احترام و درک نگرانی افراد، می‌تواند در کنترل صحنه و جلب اعتماد بیمار و همراهان موفق باشد.", "##روش تکنسین مشغول (hands-on) و نامشغول (hands-off)", "در چنین شرایطی می‌توان از این روش استفاده کرد: وقتی یک تکنسین مشغول (hands-on) به بیمار و ارزیابی او در صحنه می‌پردازد، تکنسین نامشغول (hands-off) در کناری می‌ایستد و صحنه را به‌دقت زیر نظر دارد. تکنسین نامشغول باید به تعداد و موقعیت افراد، رفت‌وآمد شاهدان، علائم دال بر تنش یا استرس، واکنش‌های غیرمعمول و رفتارهای غیرطبیعی افراد نسبت به خودش و همکارش توجه دقیق داشته باشد.", "##علائم و رمزهای قبلی", "می‌توان از علائم و رمزهای مشخص قبلی استفاده کرد. کلمات رمز و علائم دستی که از قبل بین تکنسین‌ها مشخص شده، این امکان را فراهم می‌آورد که تکنسین‌ها بدون اطلاع دیگران وضعیت خطرناک را به یکدیگر گوشزد کنند.", "در بسیاری از مواقع، به محض آن‌که یک تکنسین باتجربه وارد گفتگو با بیمار و همراهان شود و فرآیند مدیریت صحنه و ارزیابی بیمار را به دست گیرد، از دامنه‌ی تنش و اضطراب حاکم بر صحنه‌ی حادثه کاسته می‌شود."]}, {"h": "نکات تکمیلی (برگرفته از اصول رایج مراجع اورژانس مانند میستوویچ، برادی و تینتینالی)", "b": [["هرگز به ترافیک اعتماد نکنید؛ رانندگان عبوری ممکن است خسته، حواس‌پرت یا ناآگاه از صحنه باشند و حتی خودروهای امدادی را دیر ببینند.", "اصل «زمان، فاصله، محافظ»: زمان حضور در معرض ترافیک را کم کنید، تا حد امکان از خطر دور بمان   "trauma": {"sections": [{"h": "۱) ارزیابی صحنه و مکانیسم آسیب", "b": ["##اصول کلی", ["قبل از ورود به صحنه: اطلاعات دیسپچ (محل، نوع حادثه، تعداد بیماران، خطرات احتمالی، نیاز به منابع اضافی) را مرور کنید؛ ارزیابی با همین اطلاعات پیش از ورود آغاز می‌شود.", "ایمنی صحنه همیشه مقدم است: ایمنی خود ← ایمنی تیم ← ایمنی بیمار و سایر افراد. PPE مناسب بپوشید و اگر صحنه ناایمن است، پیش از تأمین ایمنی وارد نشوید.", "در صحنهٔ جرم (خشونت، تیراندازی، چاقوکشی) تا اطمینان از امنیت وارد نشوید و شواهد را تا حد امکان دست‌نخورده نگه دارید.", "هنگام رسیدن به صحنه بپرسید: چه می‌بینم؟ چه می‌شنوم و استشمام می‌کنم؟ آیا خطری وجود دارد؟ چند بیمار هست؟ منابع کافی داریم؟ آیا می‌توان بیمار را از محل خارج کرد؟", "همیشه از متدهای ساده به پیچیده پیش بروید."], "##تعداد بیماران و تریاژ", ["اگر تعداد بیماران بیش از منابع است، درخواست کمک کنید و تریاژ را شروع کنید.", "بیمار بحرانی که نیاز به انتقال فوری دارد، بیماری که ممکن است بحرانی شود یا آسیب جدی دارد، و بیماری با جراحات جزئی را از هم تفکیک کنید.", "با یک آمبولانس فقط یک مصدوم بحرانی را منتقل کنید و تا حد امکان بیماران را بین بیمارستان‌ها پخش کنید."], "##مکانیسم آسیب (MOI)", ["دانستن اینکه بیمار چگونه آسیب دیده، به کشف نوع و الگوی آسیب کمک می‌کند. انرژی منتقل‌شده به بدن عامل اصلی آسیب است.", "<b>ترومای غیرنافذ:</b> تصادفات وسایل نقلیه، سقوط، ورزش، صدمات ناشی از انفجار (سه فاز اولیه، ثانویه و ثالثیه). برای عابر پیاده، ارتفاع و نوع سطحی که قربانی روی آن افتاده و قسمتی از بدن که اول ضربه خورده را ثبت کنید. در تصادف، کودکان معمولاً به سمت وسیلهٔ نقلیه برمی‌گردند و آسیب عمدتاً به سر و تنه است؛ بزرگسالان اغلب آسیب اندام تحتانی می‌بینند.", "<b>ترومای نافذ:</b> سرعت جسم، انرژی بالا (گلوله) یا پایین (چاقو)، فاصلهٔ منبع تا بیمار و مسیر گلوله را بپرسید. در گلوله، زخم خروجی و مسیر داخل بدن را هم جستجو کنید."], "##نکات تکمیلی از مراجع (Tintinalli / Brady / PHTLS)", ["هر صدمهٔ اولیه را «مشکوک به آسیب پنهان» در نظر بگیرید؛ مکانیسم پرخطر (پرتاب از وسیله نقلیه، مرگ سرنشین دیگر در همان خودرو، واژگونی، سقوط از ارتفاع زیاد، تأخیر در خارج‌سازی) حتی با علائم حیاتی طبیعی یعنی احتمال آسیب جدی.", "در آسیب‌های نافذ تنه، تا اثبات خلاف، آسیب اعضای حیاتی را فرض کنید؛ جسم نافذ باقیمانده را خارج نکنید (مگر راه هوایی را تهدید کند) و ثابت کنید.", "خانم‌های باردار، سالمندان و کودکان با مکانیسم‌های نسبتاً خفیف هم ممکن است آسیب جدی داشته باشند."]]}, {"h": "۲) A — راه هوایی و کنترل ستون فقرات گردنی", "b": ["##اصل مهم", ["مدیریت راه هوایی مهم‌ترین و کلیدی‌ترین مرحلهٔ مراقبت از بیمار ترومایی است؛ بدون راه هوایی باز، سایر مراحل بیهوده است.", "قبل از ارزیابی A، اگر خونریزی خارجی شدید (عضو در حال خونریزی تهدیدکننده حیات) وجود دارد، ابتدا آن را کنترل کنید (eXsanguination) و بعد ABCDE را ادامه دهید. طبق پروتکل: در مصدومی که خونریزی خارجی فعال واضح دارد، یکی از پرسنل بلافاصله پس از مشاهده کنترل خونریزی را انجام می‌دهد و کارشناس ارشد همزمان طبق پروتکل بیمار را مدیریت می‌کند.", "صرف نظر از روش مراقبت راه هوایی، همواره احتمال آسیب فقرات گردنی را در نظر داشته باشید؛ هر روش نیازمند بی‌حرکت‌سازی همزمان ستون فقرات گردنی در وضع خنثی تا تثبیت کامل است."], "##ارزیابی راه هوایی", ["بیمار را صدا کنید؛ اگر طبیعی حرف می‌زند راه هوایی باز است، وگرنه با نگاه، سمع و لمس ارزیابی کنید.", "نگاه: بالا و پایین آمدن قفسهٔ سینه، حرکت پره‌های بینی، رنگ پوست، خون و ترشحات، دندان شکسته، استفراغ، هماتوم، آمفیزم زیرجلدی.", "سمع: Stridor, Snoring، خشونت صدا، کاهش صدا در یک یا هر دو طرف قفسه سینه.", "لمس: هر توده غیرطبیعی دور دهان و گردن (تورم، هماتوم، کریپتوس) را به آرامی لمس کنید.", "علائم هشدار: هرگونه صدای غیرطبیعی در راه هوایی فوقانی، ناتوانی در صحبت‌کردن."], "##نکات تکمیلی مراجع", ["اگر بیمار هشیار و آرام صحبت می‌کند، راه هوایی فعلاً باز است ولی باید مرتب بازبینی شود؛ بیماری که تغییر صدا (گرفتگی)، stridor یا تورم گردن دارد در معرض انسداد پیش‌رونده است و باید زودتر مدیریت شود.", "ترتیب مدیریت: مانورهای ساده (Jaw thrust با نگه‌داشتن همزمان سر و گردن، Trauma chin lift)، ساکشن و Finger sweep ← راه هوایی دهانی/بینی (OPA/NPA) ← راه هوایی فوق‌گلوتی (LMA، King، Combitube) ← لوله‌گذاری تراشه (ETT) ← راه هوایی جراحی (کریکوتیروتومی سوزنی/جراحی) در حالت «نمی‌توان لوله گذاشت - نمی‌توان تهویه کرد».", "<b>OPA</b> فقط در بیمار بدون رفلکس گگ؛ اندازه از گوشه دهان تا لاله گوش. <b>NPA</b> در بیمار با رفلکس گگ سالم قابل استفاده است؛ اندازه از نوک بینی تا لاله گوش، لوبریکانت بزنید؛ در شکستگی قاعده جمجمه/ترومای شدید میان‌صورت با احتیاط.", "تأیید محل لوله: روش فیزیولوژیک (صدای تنفسی، بالا آمدن قفسه، بخار در لوله) و مکانیکی (کاپنوگرافی/ETCO2، پالس اکسیمتری)؛ کاپنوگرافی موج‌دار استاندارد طلایی است. پس از هر جابه‌جایی بیمار مجدداً بررسی کنید.", "اندیکاسیون لوله‌گذاری: ناتوانی در حفظ راه هوایی، کاهش سطح هوشیاری (GCS ≤ ۸)، هیپوکسی/ هیپوونتیلاسیون مقاوم، سوختگی استنشاقی یا خطر انسداد پیش‌رونده. لوله‌گذاری نازوتراکئال کورکورانه در شک به شکستگی قاعده جمجمه یا میان‌صورت ممنوع است.", "ساکشن را کمتر از ۱۰–۱۵ ثانیه انجام دهید؛ ساکشن طولانی هیپوکسی ایجاد می‌کند."], "##کنترل ستون فقرات گردنی و کُلار", ["بی‌حرکت‌سازی کامل شامل کُلار گردنی، تخته پشتی بلند و نگه‌داشتن سر است. کُلار به‌تنهایی کافی نیست و باید همراه ثابت‌سازی دستی و ساپورت‌های کناری باشد.", "کلار به اندازه باشد؛ کلار نامناسب (بزرگ یا کوچک) ممکن است گردن را به حالت خمیده/کشیده درآورد یا راه هوایی را تنگ کند.", "کودکان: سر و زبان بزرگ‌تر، نای مخروطی کوتاه، گلوت بالاتر، اپی‌گلوت بزرگ و نرم ← مستعد انسداد؛ در بی‌حرکت‌سازی از پد زیر شانه برای رساندن گردن به وضع خنثی استفاده کنید.", "<b>معیارهای NEXUS (طبق پروتکل):</b> ستون فقرات گردن بی‌حرکت می‌شود مگر آنکه همهٔ این موارد برقرار باشند: (۱) نداشتن تندرنس میدلاین گردن، (۲) نداشتن شواهد مسمومیت، (۳) نداشتن اختلال نورولوژیک، (۴) نداشتن آسیب شدید در سایر نقاط بدن، (۵) نداشتن اختلال هوشیاری، (۶) عدم وجود مکانیسم شدید تروما.", "هنگام لوله‌گذاری یا هر مانور راه هوایی، گردن را با کمک یک نفر در وضع خنثی نگه دارید و حداقل حرکت را به گردن وارد کنید."]]}, {"h": "۳) B — تنفس و تهویه", "b": ["##ارزیابی تنفس", ["بررسی با نگاه، گوش دادن و لمس: سرعت، عمق، الگو، تلاش تنفسی، استفاده از عضلات فرعی، قرینگی حرکت قفسه، زخم‌های باز یا شکستگی دنده، رنگ پوست، وریدهای گردنی.", "صداهای تنفسی را در هر دو طرف، بالا و پایین (زیر بغل) سمع کنید؛ کاهش یا قطع صدا نشانهٔ پنوموتوراکس یا هموتوراکس است.", "لمس: کریپیتوس (آمفیزم زیر جلدی)، تندرنس، حرکت غیرطبیعی قفسه.", "بیمار بحرانی نباید برای شناسایی صداهای تنفسی غیرطبیعی تأخیر بیفتد (انتقال فوری)."], "##اقدامات پایه", ["هر بیمار ترومایی با آسیب قابل توجه باید اکسیژن مکمل با جریان بالا (ماسک رزرو بگ ۱۰–۱۵ لیتر) دریافت کند؛ هدف SpO2 بالای ۹۵٪.", "اگر تنفس کند یا تند و ناکافی است: تهویه با BVM. میزان تهویه تقریبی: بزرگسال ۱۰–۱۲ تنفس در دقیقه (۵۰۰–۸۰۰ میلی‌لیتر)، کودک ۱۲–۲۰، نوزاد ۲۰–۳۰. هیپرونتیلاسیون در بیمار با آسیب مغزی ممنوع است (بالا بردن PaCO2 پایین باعث کاهش خون‌رسانی مغز می‌شود).", "BVM با دو نفر (یکی ماسک را محکم می‌گیرد و دیگری بگ را فشار می‌دهد) مؤثرتر از یک نفر است."], "##آسیب‌های تهدیدکنندهٔ حیات قفسه سینه", ["<b>پنوموتوراکس ساده:</b> نشت هوا به فضای پلور؛ درد، تنگی نفس، کاهش صدای تنفس؛ بدون ناپایداری همودینامیک.", "<b>پنوموتوراکس باز (زخم مکنده):</b> پانسمان سه‌طرفه (اکلوزیو با یک ضلع باز)؛ کنترل مجدد برای ایجاد پنوموتوراکس فشارنده.", "<b>پنوموتوراکس فشارنده:</b> تهدید حیات: ناراحتی/دیسترس تنفسی شدید، کاهش یا قطع صدای تنفس در یک طرف، افت فشار خون، تاکی‌کاردی، برجستگی وریدهای گردنی (JVD)؛ انحراف نای علامت دیررس است. درمان: رفع فشار سوزنی (Needle decompression) — فضای بین‌دنده‌ای دوم خط میدکلاویکولار، یا فضای پنجم خط میدآگزیلاری؛ سپس انتقال سریع.", "<b>قفسهٔ سینه شناور (Flail chest):</b> دو یا چند دنده مجاور هر یک در بیش از یک محل شکسته؛ حرکت پارادوکس؛ آسیب زمینهٔ ریه (کوفتگی)؛ ثابت‌سازی و کمک تهویه با BVM در صورت نیاز.", "<b>هموتوراکس:</b> خونریزی داخل پلور؛ کاهش صدای تنفس و پرکوشن مات؛ می‌تواند شوک هموراژیک بدهد؛ در هموتوراکس ماسیو ممکن است چند لیتر خون در هر نیمه قفسه جمع شود؛ اکسیژن، مایع‌درمانی و انتقال فوری.", "<b>تامپوناد قلبی:</b> نمونهٔ آسیب نافذ؛ تریاد بک (افت فشار، صداهای قلب خفه، JVD) ← انتقال سریع."], "##نکات تکمیلی مراجع", ["پنوموتوراکس ساده را پس از شروع تهویه با فشار مثبت بررسی کنید؛ تهویه با فشار مثبت آن را به فشارنده تبدیل می‌کند، پس قبل از آن دکمپرسیون را آماده کنید.", "وجود پنوموتوراکس فشارنده یک تشخیص بالینی است؛ برای رادیوگرافی منتظر نمانید.", "شکستگی دنده‌های بالایی (اول و دوم) یا کتف و علامت کمربند ایمنی (Seat-belt sign) نشانهٔ انرژی بالا است؛ آسیب ریه، عروق بزرگ و اعضای داخل قفسه را مدنظر داشته باشید.", "در کودک، خستگی تنفسی و برادی‌کاردی علامت قریب‌الوقوع ایست است؛ کودک با نقص تنفسی را زود با BVM کمک کنید."]]}, {"h": "۴) C — گردش خون، خونریزی و شوک", "b": ["##ارزیابی گردش خون", ["ابتدا خونریزی خارجی را پیدا و کنترل کنید؛ سپس نبض (سرعت، کیفیت، ریتم)، پوست (رنگ، رطوبت، دما)، پرشدگی مویرگی و فشار خون را بسنجید.", "نبض ۱۰۰ تا ۱۲۰: شوک اولیه؛ بالای ۱۲۰: شوک (البته ترس و درد هم دخیل‌اند)؛ ۱۴۰ یا بیشتر: بحرانی و نزدیک به مرگ؛ نبض باریک و ضعیف نشانه شوک است؛ نبود نبض محیطی ← هیپوولمی شدید یا آسیب عروقی.", "پوست: رنگ‌پریده/سیانوتیک، سرد و مرطوب (شوک هموراژیک)؛ پوست گرم و خشک با افت فشار خون ← شوک نوروژنیک.", "فشار خون: اندازه‌گیری دستی در دسترس‌تر و قابل اتکاتر از دستگاه خودکار در شوک؛ عدم تأخیر برای آن؛ فشار خون پایین‌تر از ۹۰ دیررس است (۳۰٪ حجم از دست رفته).", "در کودکان، فشار خون دیررس‌ترین علامت شوک است؛ تاکی‌کاردی و پرشدگی مویرگی کند را جدی بگیرید."], "##کنترل خونریزی خارجی", ["ترتیب: فشار مستقیم با دست ← فشار و بستن (پانسمان فشاری) ← در صورت کنترل نشدن: تورنیکه (اندام‌ها) یا داروهای بندآورنده موضعی (تنه و مفاصل).", "تورنیکه: بالای محل خونریزی، نه روی مفصل؛ تا قطع خونریزی سفت شود؛ زمان بستن را ثبت و روی بیمار قید کنید؛ شل نکنید.", "حفظ هر یک عدد گلبول قرمز مهم است؛ کنترل خونریزی بسته به نوع خونریزی دارد (داخلی و خارجی). توقف خونریزی و حفظ خونرسانی بسیار حیاتی است."], "##انواع شوک", ["<b>هیپوولمیک (هموراژیک):</b> شایع‌ترین علت شوک در تروما؛ هر بیمار ترومایی با شوک را تا اثبات خلاف، هموراژیک فرض کنید.", "<b>توزیعی (نوروژنیک):</b> آسیب نخاع (بالاتر از T6): افت فشار با نبض آهسته/طبیعی و پوست گرم؛ تجویز مایعات و ثابت‌سازی؛ همیشه ابتدا خونریزی را رد کنید.", "<b>کاردیوژنیک (انسدادی):</b> تامپوناد قلبی، پنوموتوراکس فشارنده، آسیب بلانت قلب (کوفتگی میوکارد با آریتمی).", "<b>جدول طبقه‌بندی خونریزی:</b> کلاس ۱: کمتر از ۷۵۰ میلی‌لیتر (<۱۵٪)، نبض <۱۰۰، فشار خون نرمال؛ کلاس ۲: ۷۵۰–۱۵۰۰ (۱۵–۳۰٪)، نبض ۱۰۰–۱۲۰، فشار نرمال، فشار نبض کاهش؛ کلاس ۳: ۱۵۰۰–۲۰۰۰ (۳۰–۴۰٪)، نبض ۱۲۰–۱۴۰، افت فشار خون؛ کلاس ۴: بیش از ۲۰۰۰ (>۴۰٪)، نبض >۱۴۰، افت شدید فشار؛ تنفس به ترتیب ۱۴–۲۰، ۲۰–۳۰، ۳۰–۴۰، >۳۵؛ وضعیت ذهنی: کمی مضطرب ← مضطرب ← مضطرب/گیج ← گیج/بی‌حال."], "##مدیریت شوک", ["ابتدا چهار پرسش حیاتی: علت شوک چیست؟ چه مراقبت‌هایی لازم است؟ چه اقداماتی باید انجام شود؟ کدام مرکز مناسب است؟", "راه هوایی و تهویه را تضمین و اکسیژن مکمل بدهید؛ خونریزی خارجی را کنترل کنید؛ هرچه سریع‌تر خونریزی داخلی را تشخیص و به مرکز تروما منتقل کنید (کنترل خونریزی داخلی فقط در اتاق عمل).", "پوزیشن: همیشه بهترین پوزیشن خوابیده به پشت است؛ ترندلنبرگ توصیه نمی‌شود و بالا بردن اندام‌های تحتانی هم سودی ندارد.", "<b>مایع‌درمانی:</b> بیماران بزرگسال با خونریزی کنترل‌شده ممکن است ۱۰۰۰ تا ۲۰۰۰ میلی‌لیتر رینگر لاکتات یا نرمال سالین گرم نیاز داشته باشند؛ کودک ۲۰ میلی‌لیتر بر کیلوگرم کریستالوئید گرم؛ خون ترجیحی است ولی اکثراً در دسترس نیست.", "در خونریزی کنترل‌نشده: تعادل بین مایع داده‌شده و افزایش فشار خون (احیای تعدیل‌شده، <b>هیپوتانسیون مجاز</b>)؛ تلاش نکنید فشار را به حد عادی برسانید؛ تجویز زیاد مایع لخته را می‌شوید و خونریزی را بیشتر می‌کند. هدف SBP در حدود ۸۰ تا ۹۰ mmHg؛ در ضربهٔ سر با شک به افزایش ICP، SBP در محدودهٔ ۹۰–۱۰۰ mmHg حفظ شود (بالاتر از ۹۰).", "در بیمار دچار آسیب لِه‌شدگی (مانند ماندن زیر خودرو یا آوار که خارج‌سازی طولانی می‌شود): فشار سیستولیک حدود ۱۱۰ حفظ شود؛ برای جلوگیری از رابدومیولیز مایع‌درمانی بیشتر ضرورت دارد و رعایت محدودهٔ فشار یادشده لازم نیست؛ فقط نرمال سالین.", "هیپوترمی را پیشگیری کنید (کابین آمبولانس در حدود ۲۹ درجه سانتی‌گراد یا بیشتر).", "در صورت بحرانی بودن بیمار، رگ‌گیری و مایع‌درمانی را حین انتقال انجام دهید و برای آن صحنه را طولانی نکنید."], "##نکات تکمیلی مراجع", ["<b>مثلث مرگ (Lethal triad):</b> هیپوترمی، اسیدوز، کوآگولوپاتی؛ پیشگیری با گرم نگه داشتن بیمار، کنترل خونریزی و پرهیز از مایع بیش‌ازحد.", "Shock Index = ضربان قلب ÷ فشار سیستولیک؛ بالاتر از ~۰٫۹ مطرح‌کنندهٔ شوک پنهان است.", "سالمند، بیمار با بتابلاکر/پیس‌میکر، ورزشکار و باردار ممکن است تاکی‌کاردی نشان ندهند یا دیر نشان دهند. در بارداری حجم خون ۴۵–۵۰٪ بالا است و علائم شوک دیر ظاهر می‌شود؛ بعد از هفتهٔ ۲۰ بارداری خم‌کردن به چپ (Left lateral tilt) برای جلوگیری از فشار روی IVC.", "خون از دست رفته در شکستگی‌ها (تقریبی): یک دنده ≈ ۱۲۵ میلی‌لیتر؛ ساعد (زند زیرین و زبرین) ≈ ۲۵۰–۵۰۰؛ بازو ≈ ۷۵۰؛ ساق ≈ ۵۰۰–۱۰۰۰؛ ران ≈ ۱۰۰۰–۲۰۰۰؛ لگن بسیار زیاد. در شکستگی لگن ثابت‌سازی (بایندر/ملحفه) را فراموش نکنید.", "قفسه سینه و شکم می‌توانند چند لیتر خون را بدون هیچ نشانهٔ خارجی در خود نگه دارند؛ نبود خونریزی خارجی به معنای نبود خونریزی نیست."]]}, {"h": "۵) D و E، ارزیابی ثانویه، بیمار بحرانی و انتقال", "b": ["##D — ناتوانی عصبی (Disability)", ["بررسی سطح هوشیاری با AVPU و GCS، مردمک‌ها (اندازه، قرینگی، واکنش به نور) و توانایی حرکت اندام‌ها.", "AVPU: A هوشیار، V پاسخ به صدا، P پاسخ به درد، U بدون پاسخ. GCS: چشم (۴)، کلامی (۵)، حرکتی (۶)؛ حداقل ۳ و حداکثر ۱۵.", "GCS ≤ ۸ شدید، ۹–۱۲ متوسط، ۱۳–۱۵ خفیف. نمره‌ی GCS زیر ۱۳ یعنی بیمار بحرانی.", "قند خون را بسنجید (هیپوگلیسمی می‌تواند علت کاهش هوشیاری باشد)؛ مردمک‌های نابرابر یا ثابت + افت GCS = علامت افزایش ICP/فتق.", "<b>تریاد کوشینگ:</b> فشار خون بالا، برادی‌کاردی، تنفس نامنظم ← فتق مغزی.", "در صورت اختلال در D: اگر جابه‌جایی در مراحل قبل انجام نشده، IV بزرگ بگیرید و بیمار را به آمبولانس منتقل کنید، نوع انتقال را تعیین و به‌سمت مرکز درمانی حرکت و به دیسپچ اطلاع دهید.", "علائم آسیب نخاع: از دست رفتن حس و حرکت زیر سطح ضایعه و شوک نوروژنیک (هیپوتانسیون با نبض آهسته و پوست گرم)."], "##E — برهنه‌سازی و محیط (Exposure)", ["لباس‌ها را با حفظ حریم خصوصی خارج کنید، از هیپوترمی جلوگیری کنید، برای پیداکردن موارد تهدیدکنندهٔ حیات مجدداً قفسه سینه، شکم و اندام‌ها را بررسی کنید، پشت مصدوم هنگام قراردادن وی بر روی تخته پشتی بلند (Log roll) بررسی شود.", "پوشاندن بیمار با پتو بلافاصله پس از معاینه؛ هیپوترمی در بیمار ترومایی مرگ‌ومیر را بالا می‌برد."], "##ارزیابی ثانویه", ["فقط پس از انجام مراحل: ارزیابی اولیه، درمان تهدیدکنندهٔ حیات، ارزیابی مجدد و شروع انتقال. ارزیابی ثانویه نباید باعث تأخیر انتقال بیمار بحرانی شود؛ در بیمار بحرانی ممکن است اصلاً در صحنه انجام نشود (در آمبولانس انجام شود).", "اجزا: کنترل علائم حیاتی (تنفس، نبض، فشار خون،   "head-trauma": {"sections": [{"h": "۱) آناتومی، آسیب‌های پوست سر، جمجمه و مغز", "b": ["##آناتومی کاربردی", ["سر از سه لایه محافظ تشکیل شده: پوست سر (اسکالپ)، استخوان جمجمه و مننژ (سخت‌شامه/دورا، عنکبوتیه/آراکنوئید، نرم‌شامه/پیا). مغز حدود ۸۰٪ حفره جمجمه را پر می‌کند و شامل مخ (cerebrum)، مخچه (cerebellum) و ساقه مغز (برین‌استم: مغز میانی، پل مغزی، بصل‌النخاع) است؛ مراکز حیاتی تنفس و گردش خون در ساقه مغز قرار دارند.", "مخ: لوب پیشانی (حرکت، قضاوت، شخصیت و ناحیه بروکا)، آهیانه‌ای (حس و جهت‌یابی)، گیجگاهی (شنوایی، حافظه و ناحیه ورنیکه) و پس‌سری (بینایی).", "CSF (مایع مغزی‌نخاعی) حدود ۱۲۵–۱۵۰ میلی‌لیتر است و ضربه‌گیر مغز محسوب می‌شود. شریان مننژیال میانی در شیار استخوان تمپورال قرار دارد و با شکستگی آن هماتوم اپیدورال ایجاد می‌شود.", "<b>CPP = MAP − ICP:</b> فشار پرفیوژن مغزی برابر است با فشار متوسط شریانی منهای فشار داخل جمجمه؛ مقدار طبیعی حدود ۷۰–۸۰ mmHg و حداقل لازم ۵۰–۶۰ است. هر چه ICP بالاتر، CPP و خون‌رسانی مغز کمتر می‌شود.", "فشار داخل جمجمه (ICP) در حالت طبیعی کمتر از ۱۵ mmHg است و مقدار بالای ۲۰ بحرانی محسوب می‌شود. مکانیسم «مونرو–کیلی»: جمجمه یک محفظهٔ بسته است؛ افزایش حجم یکی از اجزا (مغز، خون، CSF) ابتدا با جابه‌جایی CSF و خون جبران می‌شود، ولی پس از اتمام این ذخیره ICP ناگهان بالا می‌رود."], "##آسیب پوست سر (Scalp)", ["پوست سر عروق فراوان دارد و حتی زخم کوچک می‌تواند خونریزی زیادی بدهد؛ در کودکان و نوزادان خونریزی اسکالپ ممکن است باعث شوک هیپوولمیک شود.", "اقدام: موها را کنار بزنید یا قیچی کنید، زخم را با نرمال سالین شستشو دهید (در صورت نبود خونریزی شدید) و پانسمان کنید.", "خونریزی را با فشار مستقیم کنترل کنید؛ ولی اگر شک به شکستگی فرورفته یا قطعات استخوانی در زخم وجود دارد، فشار نیاورید و از پانسمان حجیم/حلقوی بدون فشار روی محل استفاده کنید.", "اسکالپ جدا شده را در گاز مرطوب استریل قرار دهید و همراه بیمار منتقل کنید؛ هماتوم زیر پوست را لمس و اندازه آن را ثبت کنید، چون ممکن است اندازهٔ واقعی آسیب را نشان دهد."], "##شکستگی‌های جمجمه", ["<b>خطی (Linear):</b> شایع‌ترین؛ اغلب در استخوان تمپورال؛ خود شکستگی عارضه‌ای ندارد ولی اگر شریان مننژیال میانی را پاره کند منجر به هماتوم اپیدورال می‌شود.", "<b>فرورفته (Depressed):</b> با ضربهٔ کوچک و متمرکز؛ فشار روی مغز و احتمال کوفتگی/هماتوم.", "<b>باز (Open):</b> همراه با پارگی پوست و در معرض قرار گرفتن بافت مغز؛ خطر عفونت و مرگ بالا.", "<b>قاعده جمجمه (Basilar):</b> علائم: علامت راکون (کبودی دور چشم؛ شکستگی قاعده قدامی/سینوس اسفنوئید)، علامت بتل (کبودی پشت گوش روی ماستوئید؛ شکستگی تمپورال)، رینوره/اتوره (خروج CSF یا خون از بینی/گوش)، هموتیمپانوم (خون پشت پرده تمپان) و علامت هالو (حلقهٔ روشن دور لکه خون روی گاز). در این بیماران لوله‌گذاری از راه بینی و NPA ممنوع/خطرناک است و خروج مایع را نباید پک کرد."], "##انواع آسیب مغزی (TBI)", ["<b>موضعی (Focal):</b> کوفتگی مغز (Contusion)، هماتوم داخل مغزی (ICH)، اپیدورال، ساب‌دورال و ساب‌آراکنوئید.", "<b>منتشر (Diffuse):</b> تکان مغزی (Concussion) و آسیب منتشر آکسونی (DAI).", "<b>تکان مغزی:</b> اختلال گذرای عملکرد؛ گیجی، فراموشی، سردرد، تهوع؛ CT ممکن است طبیعی باشد؛ از دست دادن هوشیاری لازم نیست. <b>DAI:</b> شدیدترین نوع؛ ناشی از شتاب و چرخش سر؛ از ابتدا بیهوشی طولانی؛ ۹۰٪ این بیماران به هوش نمی‌آیند یا با معلولیت شدید می‌مانند.", "<b>جمع‌بندی خونریزی‌ها (تصویر زیر):</b> ساب‌دورال: هلالی، پارگی وریدهای پل‌زننده، سالمندان و الکلی‌ها؛ اپیدورال: عدسی (محدب‌الطرفین)، شریان مننژیال میانی، نوجوانان و جوانان؛ ساب‌آراکنوئید: خون در شیارها و سیسترن‌ها، پارگی آنوریسم Berry، سردرد ناگهانی و شدید؛ داخل مغزی: خون در پارانشیم/بطن‌ها، اغلب پرفشاری خون مزمن.", "<img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/7QB8UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAGAcAigAWkZCTUQyMzAwMDk2YzAxMDAwMGFiNTcwMDAwYWI4ZDAwMDBmN2M4MDAwMDQ4MTYwMjAwYjg1YjAyMDA1ZWRmMDIwMDNjMzMwMzAwOWM2YzAzMDBjNTFhMDQwMAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wgARCAUABAADASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAAAAEFBgcCAwQICf/EABwBAQACAwEBAQAAAAAAAAAAAAABAwIEBQYHCP/aAAwDAQACEAMQAAAA8qKgKIoAAgAqKXT7m+WF+ntRGF8Ne1OI8R+o/OVbH0gjrFOyhLEmuk8IXLAp6elKSu2j /qf7n+p/qf6n+5/uf7n+5/uf6n+5+AqgWeBge+Y2r1X/APxGXCv/AO9Mv/Oue0PzP9QqFzP8Y/EKPucnc/H/APO//9k=\" alt=\"Cerebral Hemorrhages\" onclick=\"openZoom(this.src)\" style=\"width:100%;border-radius:12px;border:1px solid var(--border);cursor:zoom-in;margin:6px 0\"><div style=\"font-size:12px;color:var(--text-dim);text-align:center\">انواع خونریزی مغزی — شکل CT و ویژگی‌های کلیدی (برای بزرگ‌نمایی لمس کنید)</div>", "<b>اپیدورال:</b> ≈ ۲٪ از TBIها، پیشرفت سریع (دقایق تا ساعت‌ها)، «فاصلهٔ هوشیار» (lucid interval) پس از کاهش اولیه هوشیاری، سپس افت سریع؛ مردمک دیلاته هم‌سمت ضربه و همی‌پارزی سمت مقابل؛ مرگ و میر ≈ ۲۰٪ ولی با تشخیص و جراحی سریع تا ≈ ۲٪ کاهش می‌یابد.", "<b>ساب‌دورال:</b> ≈ ۳۰٪ آسیب‌های جدی مغزی؛ منشأ وریدی (فشار کم)؛ حاد و مزمن؛ همراهی بیشتر با آسیب پارانشیم؛ پیش‌آگهی بدتر از اپیدورال؛ در سالمندان، مصرف‌کنندگان وارفارین و الکلی‌ها حتی با ضربه کوچک.", "<b>ساب‌آراکنوئید:</b> سردرد ناگهانی و بسیار شدید، سفتی گردن، تهوع، فتوفوبیا و کاهش هوشیاری؛ خطر ICP بالا و فتق."]]}, {"h": "۲) آسیب ثانویه مغزی، ICP و فتق مغزی", "b": ["##آسیب اولیه و ثانویه", ["<b>آسیب اولیه:</b> در لحظه ضربه رخ می‌دهد و قابل برگشت نیست (پارگی، کوفتگی، آسیب آکسونی).", "<b>آسیب ثانویه:</b> ساعت‌ها و روزها بعد از ضربه به دلیل هیپوکسی، افت فشار خون، ادم و ICP بالا رخ می‌دهد و <b>مهم‌ترین هدف مراقبت پیش‌بیمارستانی پیشگیری از آن است.</b>", "عوامل خارج جمجمه‌ای: هیپوتانسیون (SBP زیر ۹۰ مرگ‌ومیر را حدود ۲ برابر می‌کند)، هیپوکسی (PaO2 زیر ۶۰)، کم‌خونی، تشنج، هیپو/هیپرگلیسمی، هیپو/هیپرکاپنی. عوامل داخل جمجمه‌ای: ادم، هماتوم، ICP بالا، ایسکمی.", "در بیمار TBI، هیپوتانسیون تقریباً هیچ‌گاه ناشی از خود آسیب مغزی نیست (مگر در مراحل پایانی یا نوزادان)؛ به‌دنبال خونریزی دیگر بگردید (قفسه، شکم، لگن، ران، خارجی)."], "##علائم افزایش ICP", ["کاهش سطح هوشیاری، سردرد، تهوع و استفراغ (گاهی پرتابی)، مردمک‌های نابرابر یا غیرقرینه، دیلاته و کند/بی‌پاسخ به نور.", "وضعیت دکورتیکه (خم‌شدگی اندام فوقانی) یا دسربره (اکستانسیون)؛ تشنج؛ الگوی غیرطبیعی تنفس.", "<b>تریاد کوشینگ</b> (علامت دیررس): افزایش فشار سیستولیک، برادی‌کاردی (کاهش ضربان)، تنفس نامنظم؛ همراه با فشار نبض باز (پهن).", "علائم هشدار فتق: GCS < ۹ با دکورتیکه/دسربره، افت سریع هوشیاری (۲ نمره یا بیشتر) و مردمک‌های نامتقارن."], "##فتق مغزی (Herniation)", ["فتق: جابه‌جایی بافت مغز از طریق سوراخ‌های جمجمه. انواع: آنکال (Uncal)، سینگولیت، مرکزی و تونسیلار.", "<b>آنکال (شایع‌ترین):</b> فشار بر عصب جمجمه‌ای سوم (اکولوموتور) ← دیلاته شدن و ثابت شدن مردمک هم‌سمت ضایعه، ptosis و همی‌پارزی سمت مقابل؛ در نهایت کما و ساقه مغز تحت فشار.", "<b>تونسیلار:</b> فرو رفتن لوزه‌های مخچه در فورامن مگنوم و فشار بر بصل‌النخاع ← ایست تنفسی/قلبی.", "وضعیت‌های حرکتی: <b>دکورتیکه</b> (فلکسیون بازو، اکستانسیون پاها؛ آسیب بالای ساقه) و <b>دسربره</b> (اکستانسیون هر چهار اندام؛ آسیب ساقه مغز، پیش‌آگهی بدتر).", "<b>الگوهای تنفسی در آسیب مغزی:</b> Cheyne-Stokes (چرخه‌های عمیق و آهسته با آپنه)، هایپرونتیلاسیون مرکزی نوروژنیک (تند و عمیق مداوم)، آتاکسیک (کاملاً نامنظم)، Biot (دسته‌های تنفس با آپنه نامنظم) و Kussmaul (عمیق و تند، نوعاً در اسیدوز)."], "##نکات تکمیلی مراجع (Tintinalli / Brady / PHTLS)", ["مردمک یک‌طرفه دیلاته و بی‌پاسخ + GCS پایین یعنی فتق قریب‌الوقوع؛ هر کاهش ۲ نمره‌ای GCS را به پزشک اطلاع دهید.", "هیپرونتیلاسیون بی‌رویه خطرناک است (کاهش PaCO2 باعث انقباض عروق مغز و ایسکمی می‌شود)؛ هدف عادی ETCO2 حدود ۳۵–۴۰ mmHg و فقط در فتق آشکار کوتاه‌مدت به ۳۰–۳۵ کاهش داده می‌شود.", "<b>«دو ضربه» به مغز:</b> هیپوکسی (SpO2 زیر ۹۰٪) و هیپوتانسیون (SBP زیر ۹۰) هر کدام پیش‌آگهی را بدتر می‌کنند؛ هیچ‌کدام را تحمل نکنید.", "قند خون را همیشه بسنجید: هیپوگلیسمی تقلید ضایعهٔ مغزی است و هیپرگلیسمی طولانی هم به مغز آسیب‌دیده ضرر می‌رساند.", "استروئید (دگزامتازون/متیل‌پردنیزولون) در TBI اندیکاسیون ندارد و می‌تواند مضر باشد. تجویز مانیتول/سالین هیپرتونیک و ترانگزامیک‌اسید تصمیم پزشک/بیمارستان است.", "سر کودک: در نوزاد، برجستگی فونتانل علامت ICP بالا است؛ خونریزی اسکالپ/داخل جمجمه در نوزادان می‌تواند شوک ایجاد کند.", "مصرف الکل یا مواد را دلیل کاهش هوشیاری نپندارید؛ تا اثبات خلاف، کاهش هوشیاری را ناشی از آسیب مغزی یا هیپوکسی بدانید."]]}, {"h": "۳) مدیریت پیش‌بیمارستانی ترومای سر (طبق پروتکل)", "b": ["##گام‌های اصلی پروتکل", ["ابتدا <b>پروتکل جامع برخورد با بیمار ترومایی</b> را اجرا کنید؛ توجه ویژه به <b>کنترل خونریزی اسکالپ</b> و <b>بستن کلار گردنی</b>.", "<b>اگر GCS ≤ ۸:</b> ابتدا راه هوایی پایدار برقرار کنید. سپس اگر تشنج دارد، به پروتکل تشنج مراجعه شود.", "<b>SpO2 ≥ ۹۵٪</b> حفظ شود: اکسیژن با کانولای بینی؛ اگر SpO2 زیر ۹۵٪ است، روش‌های با غلظت بالاتر (ماسک)، و در صورت نیاز تهویه با فشار مثبت (BVM، LMA، لوله‌گذاری).", "<b>افت فشار خون:</b> فشار سیستولیک را با مایع‌درمانی (نرمال سالین) در محدوده <b>۹۰ تا ۱۰۰ mmHg</b> نگه دارید. در بیماری که SBP بالاتر از این است و افت ندارد، اقدامی برای پایین آوردن فشار نکنید (به‌ویژه در افزایش شدید ICP).", "<b>قند خون:</b> اگر BS ≤ ۷۰ mg/dl ← درمان طبق پروتکل هیپوگلیسمی.", "<b>آیا علائم افزایش ICP دارد؟</b> اگر بله، اقدامات زیر را در نظر بگیرید؛ اگر خیر: مشاوره پزشکی، انتقال و اطلاع فوری به مرکز درمانی مناسب و پایش مداوم."], "##در صورت علائم افزایش ICP", ["<b>شل کردن کولار گردنی:</b> اگر کلار خیلی سفت است، آن را شل کنید و ثبات گردن را با ابزار دیگر محدودکنندهٔ حرکت (کیسهٔ شن/ساپورت کناری) حفظ کنید؛ کلار بسیار محکم می‌تواند با اختلال در تخلیه وریدی ICP را بالا ببرد.", "<b>آرام‌سازی:</b> میدازولام ۱ تا ۱٫۵ mg آهسته وریدی با توجه به آپنه و افت فشار (در صورت پاسخ ناکافی با مشاوره پزشکی). <b>در شوک، بنزودیازپین ممنوع است.</b>", "<b>تهوع و استفراغ:</b> آندانسترون بزرگسال ۴ mg؛ کودک ۰/۱۵ mg/kg (حداکثر ۴ mg) آهسته وریدی.", "<b>هیپرونتیلاسیون کنترل‌شده:</b> بزرگسال ۲۰ تنفس در دقیقه، کودک ۲۵ تنفس در دقیقه، تا رفع علائم ICP بالا.", "<b>پوزیشن:</b> در صورت امکان زاویه‌دادن تخت به‌نحوی که سر و تنه ۳۰ درجه بالاتر قرار گیرد (در حالی که ستون فقرات ثابت است).", "<b>خروج مایع از گوش یا بینی:</b> با گاز استریل، محل را پانسمان کنید (پک نکنید و جلوی خروج را نگیرید).", "<b>هیپرونتیلاسیون و فتق:</b> برای علائم قریب‌الوقوع فتق: GCS < ۹ همراه با دکورتیکه/دسربره، افت سریع هوشیاری (۲ نمره)، مردمک‌های نامتقارن."], "##ارزیابی و اقدامات کلی (فصل PHTLS/ پروتکل کشوری)", ["رعایت احتیاطات BSI و تأمین ایمنی صحنه؛ مکانیسم حادثه: شیشه جلوی خودرو، کلاه ایمنی شکسته، سقوط و … نشانهٔ ضربهٔ شدید به سر است.", "<b>ABCDE:</b> راه هوایی با Jaw thrust/Chin lift (با ثابت‌سازی گردن)، ساکشن، OPA/NPA (NPA در شکستگی قاعده جمجمه ممنوع/خطرناک)؛ در GCS < ۸ انتوباسیون (با ثبات گردن؛ RSI فقط توسط فرد ماهر؛ لوله‌گذاری نازوتراکئال در ترومای میان‌صورت نسبتاً ممنوع).", "تنفس: تهویه طبیعی بزرگسال حدود ۱۰ تا ۱۲، کودک ۲۰ و شیرخوار ۲۵ بار در دقیقه (با BVM در صورت نیاز)؛ هیپرونتیلاسیون روتین ممنوع و فقط در علائم ICP/فتق با نرخ‌های پروتکل (بزرگسال ۲۰، کودک ۲۵) انجام می‌شود.", "گردش خون: خونریزی خارجی را کنترل کنید؛ IV بزرگ؛ SBP > ۹۰؛ در بیمار TBI با علائم حیاتی نرمال و بدون آسیب دیگر، تزریق مایع بیش از حدود ۱۲۵ میلی‌لیتر در ساعت لازم نیست؛ مایع بی‌احتیاط خطر ادم مغزی دارد.", "D: GCS، مردمک‌ها (اندازه، قرینگی، واکنش به نور)، قدرت اندام‌ها و ثبت زمان؛ هر ۵ دقیقه ارزیابی مجدد؛ هر کاهش ۲ نمره GCS را گزارش کنید. E: برهنه‌سازی، پیشگیری از هیپوترمی (کابین ~ ۲۹ درجه).", "<b>تشنج:</b> محافظت از راه هوایی و اکسیژن؛ بنزودیازپین (دیازپام ۰٫۱ mg/kg وریدی) طبق پروتکل؛ در بیمار شوکه با احتیاط. هیپوگلیسمی و هیپوکسی را رد کنید.", "انتقال: مرکز دارای CT و جراح مغز و اعصاب (مرکز تروما)؛ در بیمار با افت ABC یا هوشیاری، نزدیک‌ترین مرکز مناسب با اطلاع قبلی؛ قبل از رسیدن، GCS و اقدامات و علائم حیاتی را از طریق دیسپچ اعلام کنید."], "##یادآوری NEXUS و اصطلاحات", ["ستون فقرات گردن با توجه به مکانیسم بی‌حرکت می‌شود مگر هر ۶ مورد برقرار باشد: بدون تندرنس میدلاین گردن، بدون شواهد مسمومیت، بدون اختلال نورولوژی، بدون آسیب شدید در سایر نقاط، بدون اختلال هوشیاری، بدون مکانیسم شدید.", "TBI: آسیب مغزی تروماتیک · ICP: فشار داخل جمجمه · CPP: فشار پرفیوژن مغزی · MAP: فشار متوسط شریانی · GCS: مقیاس کمای گلاسکو · DAI: آسیب منتشر آکسونی · ICH: خونریزی داخل مغز · SAH: خونریزی ساب‌آراکنوئید · BS: قند خون."]]}], "quiz": [{"q": "در پروتکل ترومای سر، اولین گام کدام است؟", "o": ["اجرای پروتکل جامع بیمار ترومایی با توجه به کنترل خونریزی اسکالپ و بستن کلار گردنی", "فقط تجویز اکسیژن", "تجویز مانیتول", "انتقال بدون ارزیابی"], "a": 0, "why": "ابتدا پروتکل جامع بیمار ترومایی اجرا می‌شود، ب
