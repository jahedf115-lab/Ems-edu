function mark(){var m=msgs.filter(function(x){return x.from_role!==PANEL&&(Date.parse(x.at)||0)>(+C.ls(SEEN)||0)}).length;btn.textContent='ارتباطات'+(m?' ('+m.toLocaleString('fa-IR')+')':'')}
function draw(){list.replaceChildren();if(!msgs.length)list.textContent='پیامی نیست.';msgs.forEach(function(m){var a=el('article');a.append(el('small',(m.kind==='report'?'گزارش · ':'')+(C.roleName[m.from_role]||m.from_role)+' ← '+(C.roleName[m.to_role]||m.to_role)+' · '+C.fa(m.at)),el('h3',m.subject),el('p',m.body,'white-space:pre-wrap'));list.append(a)})}
async function load(){if(busy){again=1;return}var id=C.id();if(!id){note.textContent=L()?'ارتباطات به ورود آنلاین نیاز دارد.':'';return}busy=true;try{msgs=await C.call('msg_list',{},id)||[];note.textContent='';draw();if(!sec.hidden){C.ls(SEEN,String(Date.now()));}mark()}catch(e){note.textContent=e.message}finally{busy=false;if(again){again=0;load()}}}
ref.onclick=load;
form.onsubmit=async function(e){e.preventDefault();send.disabled=true;note.textContent='در حال ارسال…';try{await C.call('msg_send',{to:kind.value==='report'?'manager':to.value,kind:kind.value,subject:subj.value.trim(),text:text.value.trim()});subj.value=text.value='';await load();note.textContent='ارسال شد.'}catch(x){note.textContent=x.message}finally{send.disabled=false}};
btn.onclick=function(){for(var i=0;i<host.children.length;i++){var c=host.children[i];if(c.tagName==='SECTION'&&c!==sec&&c.id!=='app')c.hidden=true}
 for(var b of nav.children)b.setAttribute('aria-pressed',String(b===btn));sec.hidden=false;C.ls(SEEN,String(Date.now()));load()};
nav.addEventListener('click',function(e){var t=e.target;if(t&&t.tagName==='BUTTON'&&!t.dataset.c)sec.hidden=true},true);
C.startPing();setInterval(load,60000);addEventListener('online',load);setTimeout(load,2500);
})();
